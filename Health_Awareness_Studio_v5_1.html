/* ============================================================
Self-contained, offline-capable, no external dependencies.
Theme: White / Green / Medical Blue.
============================================================ */
:root {
--green: #1a9f6e; --green-dark: #0f7a52; --green-soft: #e7f6ef;
--blue: #1668c1; --blue-soft: #e8f1fb;
--ink: #1f2a33; --muted: #65727d; --line: #e6ebef; --bg: #f4f7f9;
--card: #ffffff; --warn: #d98a1a; --danger: #d9482b;
--radius: 16px; --shadow: 0 1px 2px rgba(16,40,60,.05),0 6px 18px rgba(16,40,60,.06);
--font: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14.5px; line-height: 1.5; }
button { font-family: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }


/* Sidebar */
.side {
background: linear-gradient(180deg, #0f7a52, #0c6647);
color: #eafaf3;
padding: 18px 14px;
position: sticky;
top: 0;
height: 100vh;
overflow: auto;
z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.brand .logo {
width: 38px; height: 38px; border-radius: 10px; background: #fff;
display: grid; place-items: center; color: var(--green-dark);
font-weight: 800; font-size: 20px;
}
.brand h1 { font-size: 15px; margin: 0; line-height: 1.15; font-weight: 700; }
.brand small { color: #bfe6d6; font-size: 11px; font-weight: 500; }
.nav { margin-top: 16px; display: flex; flex-direction: column; gap: 2px; }
.nav button {
display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
background: transparent; border: 0; color: #dff5ea; padding: 10px 12px;
border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500;
}
.nav button .ic { width: 20px; text-align: center; }
.nav button:hover { background: rgba(255,255,255,.09); }
.nav button.active { background: #fff; color: var(--green-dark); font-weight: 700; }
.side .foot { margin-top: 18px; font-size: 11px; color: #bfe6d6; border-top: 1px solid rgba(255,255,255,.15); padding-top: 12px; }


/* Main */
.main { padding: 22px 26px 60px; overflow: auto; }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h2 { margin: 0; font-size: 20px; }
.page-head .sub { color: var(--muted); font-size: 13px; }
.searchbox { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 200px; }
.searchbox input { border: 0; outline: 0; flex: 1; font-size: 14px; background: transparent; }


.grid { display: grid; gap: 16px; }
.cards { grid-template-columns: repeat(4,1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .lbl { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.stat .val { font-size: 26px; font-weight: 800; line-height: 1; }
.stat .hint { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); }
.pill.blue { background: var(--blue-soft); color: var(--blue); }
.pill.warn { background: #fdf1e0; color: var(--warn); }
.pill.gray { background: #eef2f5; color: var(--muted); }
.pill.danger { background: #fbe9e5; color: var(--danger); }
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.col { flex: 1; min-width: 280px; }
h3.sec { font-size: 15px; margin: 0 0 12px; }
.btn {
display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line);
background: #fff; color: var(--ink); padding: 9px 14px; border-radius: 10px;
font-size: 13.5px; font-weight: 600; cursor: pointer; transition: .12s;
}
.btn:hover { border-color: #cdd6dd; background: #fbfdfe; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.blue:hover { background: #12569f; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: #c0392b; }
.btn.sm { padding: 6px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
label.fld { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 5px; }
input.inp, select.inp, textarea.inp { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 14px; font-family: inherit; outline: 0; background: #fff; }
input.inp:focus, select.inp:focus, textarea.inp:focus { border-color: var(--green); }
.field { margin-bottom: 14px; }
.muted { color: var(--muted); }
.kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 700; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { border: 1px solid var(--line); background: #fff; padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
.tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.posterwrap { background: #f0f4f6; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.posterwrap canvas, .posterwrap img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: var(--shadow); background: #fff; }
.thumbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
.thumb { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.thumb .imgbox { background: #eef3f5; display: grid; place-items: center; aspect-ratio: 1/1; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .meta { padding: 9px 10px; font-size: 11.5px; }
.thumb .meta b { display: block; font-size: 12px; margin-bottom: 3px; }
.thumb .actions { display: flex; gap: 6px; padding: 0 10px 10px; }
.thumb .actions .btn { padding: 5px 8px; font-size: 11px; flex: 1; justify-content: center; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th, table.tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
table.tbl th { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; }
.calgrid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.calcell { background: #fff; border: 1px solid var(--line); border-radius: 9px; min-height: 78px; padding: 7px; font-size: 11.5px; cursor: pointer; position: relative; }
.calcell:hover { border-color: var(--green); }
.calcell.empty { background: transparent; border: 0; cursor: default; }
.calcell .d { font-weight: 700; color: var(--muted); }
.calcell.today { outline: 2px solid var(--green); }
.calcell .ev { margin-top: 4px; font-weight: 600; line-height: 1.25; color: var(--ink); font-size: 10.5px; }
.calcell .cat { position: absolute; bottom: 6px; left: 7px; width: 8px; height: 8px; border-radius: 50%; }
.dow { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin-bottom: 6px; }
.dow div { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.captionbox { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; margin-bottom: 12px; }
.captionbox .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.captionbox pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; margin: 0; color: #2b3843; }
.bar { height: 8px; background: #eef2f5; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; font-size: 12px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .25s; z-index: 9999; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-state .big { font-size: 40px; margin-bottom: 8px; }
.countdown { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 22px; color: var(--blue); }
.badge-lang { font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px; }
.badge-lang.en { background: var(--blue-soft); color: var(--blue); }
.badge-lang.gu { background: var(--green-soft); color: var(--green-dark); }
.workflow { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
.workflow-step { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; font-size: 12px; }
.workflow-step.done { border-color: var(--green); background: var(--green-soft); }
.workflow-step.active { outline: 2px solid var(--blue); }
.statusline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.poster-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 14px; }
.poster-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.poster-card img { width: 100%; display: block; background: #eef3f5; }
.poster-card .meta { padding: 10px; }
.notice { padding: 10px 12px; border-radius: 10px; background: #fff7e6; border: 1px solid #f2d391; font-size: 12.5px; }
.progress { height: 8px; background: #e8edf1; border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); width: 0; }
.flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.gap-4 { gap: 4px; }
.editor-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.editor-tools .btn { font-size: 12px; padding: 6px 10px; }
.layer-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: #fafcfc; }
.layer-item { display: flex; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
.layer-item:hover { background: var(--bg); }
.layer-item.active { background: var(--blue-soft); font-weight: 600; }
.diag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; }
.diag-card { padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.diag-card .val { font-size: 28px; font-weight: 800; }
.diag-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
.diag-card.ok { border-left: 4px solid var(--green); }
.diag-card.warn { border-left: 4px solid var(--warn); }
.diag-card.err { border-left: 4px solid var(--danger); }
.modal-backdrop { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:999; }
.modal { background:#fff; border-radius:16px; padding:24px; max-width:520px; width:90%; max-height:90vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.2); }
.modal h3 { margin:0 0 12px; }
.modal .btnrow { margin-top:16px; }
@media (max-width:1080px) { .cards { grid-template-columns: repeat(2,1fr); } }
@media (max-width:860px) { .app { grid-template-columns: 1fr; } .side { position: static; height: auto; } .nav { flex-direction: row; flex-wrap: wrap; } }
@media (max-width:600px) { .cards { grid-template-columns: 1fr; } .workflow { grid-template-columns: 1fr; } }
</style>

function buildFixedCalendar() {
const calendar = [];
const start = new Date('2026-01-01T00:00:00Z');
const end = new Date('2026-12-31T00:00:00Z');
let curatedIdx = 0;
for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
const dateStr = d.toISOString().slice(0, 10);
const off = OFFICIAL_DAYS[dateStr];
let entry;
if (off) {
entry = { date: dateStr, category: off.category, titleEn: off.titleEn, importanceEn: off.importanceEn, authorities: off.authorities || [], status: 'official' };
} else {
const theme = CURATED_THEMES[curatedIdx % CURATED_THEMES.length];
curatedIdx++;
entry = { date: dateStr, category: theme.category, titleEn: theme.titleEn, importanceEn: theme.importanceEn, authorities: [], status: 'curated' };
}
entry.titleGu = GUJ_TITLE[entry.titleEn] || entry.titleEn;
entry.importanceGu = GUJ_IMP[entry.importanceEn] || entry.importanceEn;
entry.categoryGu = GUJ_CAT[entry.category] || entry.category;
const actions = CATEGORY_ACTIONS[entry.category] || CATEGORY_ACTIONS['Health'];
entry.actionsEn = actions.slice(0, 4);
entry.actionsGu = entry.actionsEn.map(a => GUJ_ACTION[a] || a);
entry.hashtags = (entry.titleEn.match(/[A-Za-z]+/g)||[]).slice(0,3).map(w=>w[0].toUpperCase()+w.slice(1));
if (entry.hashtags.length) entry.hashtags[0] = entry.hashtags[0] + 'Day';
const catIconMap = {
'Health':'heart','Health & Nutrition':'apple','Physical Activity':'walk','Public Health':'shield',
'Health & Inclusion':'heart','Mental & Physical Health':'brain','National':'flag',
'Language & Culture':'book','Mental Health':'brain','Reproductive & Maternal Health':'mom',
'Child Health':'child','Adolescent Health':'teen','Healthy Ageing':'elder',
'Safety & Injury Prevention':'shield','Vector-Borne Disease':'mosquito',
'Communicable Disease':'virus','Immunization':'syringe','Nutrition':'apple',
"Women's Health":'woman',"Men's Health":'man','Environment':'leaf',
'Science & Inclusion':'microscope','Communication':'megaphone','Social':'handshake',
'Emergency Preparedness':'firstaid','National & Labour':'flag','Media':'news',
'Health & Humanitarian':'heart','Family & Social':'family','National & Science':'atom',
'Consumer Affairs':'cart','Agriculture':'plant','Health & Environment':'leaf',
'National & Education':'cap','National & Legal':'gavel','Science':'microscope',
'National & Media':'newspaper','Environment & Livelihood':'tree','Environment & Agriculture':'plant',
'Governance':'building','Rights':'scales','Environment & Energy':'sun',
'National & Economy':'money','Health & Sports':'sport','National & Social':'community',
'Peace':'peace','Water Safety':'water','Education & Skills':'graduation',
'Health & Family':'family','Health & International':'globe','Humanitarian':'help',
'National & Agriculture':'tractor','National & Consumer Affairs':'shopping',
'National & Governance':'government','National & Language':'language',
'National & Peace':'peace','Occupational Health':'helmet','Health & Rights':'justice',
'National & Health':'cross','Culture':'book','Education':'cap','Safety':'shield',
'Health & Peace':'peace','Environment & Tourism':'tree','Health & National':'cross',
'Health & Social':'heart'
};
entry.icon = catIconMap[entry.category] || 'heart';
calendar.push(entry);
}
return calendar;
}


function validateCalendar(cal) {
if (cal.length !== 365) throw new Error('Calendar must have 365 entries');
const dateSet = new Set(cal.map(r => r.date));
if (dateSet.size !== 365) throw new Error('Duplicate dates');
const expected = [];
for (let d = new Date('2026-01-01T00:00:00Z'); d <= new Date('2026-12-31T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 1)) {
expected.push(d.toISOString().slice(0, 10));
}
for (const e of expected) if (!dateSet.has(e)) throw new Error('Missing date: ' + e);
const implIcons = new Set(['cross','heart','leaf','flag','apple','walk','shield','brain','book','mom','child','teen','elder','mosquito','virus','syringe','microscope','megaphone','handshake','firstaid','news','family','atom','cart','plant','cap','gavel','newspaper','tree','building','scales','sun','money','sport','community','peace','water','graduation','globe','help','tractor','shopping','government','language','helmet','justice','venus','woman','man']);
for (const r of cal) {
if (!r.titleGu || r.titleGu === r.titleEn) throw new Error(r.date + ': missing Gujarati title');
if (!r.importanceGu || r.importanceGu === r.importanceEn) throw new Error(r.date + ': missing Gujarati importance');
if (!r.categoryGu || r.categoryGu === r.category) throw new Error(r.date + ': missing Gujarati category');
if (r.actionsEn.length !== 4 || r.actionsGu.length !== 4) throw new Error(r.date + ': need 4 actions');
r.actionsEn.forEach((a, i) => { if (!r.actionsGu[i] || r.actionsGu[i] === a) throw new Error(r.date + ': action "'+a+'" missing translation'); });
if (!implIcons.has(r.icon)) throw new Error(r.date + ': unsupported icon "'+r.icon+'"');
}
}
const CALENDAR = (() => { const c = buildFixedCalendar(); validateCalendar(c); return c; })();

// 2. STORAGE (IndexedDB)
// =====================================================================
const DB_NAME = 'HealthAwarenessStudio';
const DB_VER = 3;
const STORE = 'dailyRuns';
const TEMPLATE_STORE = 'templates';
const SCHEDULE_STORE = 'schedules';
const PACK_STORE = 'artworkPack';
let dbp = null;


function openDB() {
if (dbp) return dbp;
dbp = new Promise((resolve, reject) => {
const req = indexedDB.open(DB_NAME, DB_VER);
req.onupgradeneeded = (ev) => {
const db = ev.target.result;
if (!db.objectStoreNames.contains(STORE)) {
const os = db.createObjectStore(STORE, { keyPath: 'date' });
os.createIndex('titleEn', 'titleEn');
}
if (!db.objectStoreNames.contains(TEMPLATE_STORE)) {
db.createObjectStore(TEMPLATE_STORE, { keyPath: 'id', autoIncrement: true });
}
if (!db.objectStoreNames.contains(SCHEDULE_STORE)) {
db.createObjectStore(SCHEDULE_STORE, { keyPath: 'id', autoIncrement: true });
}
if (!db.objectStoreNames.contains(PACK_STORE)) {
db.createObjectStore(PACK_STORE); // key: 'pack'
}
};
req.onsuccess = () => resolve(req.result);
req.onerror = () => reject(req.error);
});
return dbp;
}


function dbGet(store, key) {
return openDB().then(db => new Promise((res, rej) => {
const tx = db.transaction(store, 'readonly');
const rq = tx.objectStore(store).get(key);
rq.onsuccess = () => res(rq.result || null);
rq.onerror = () => rej(rq.error);
}));
}


function dbPut(store, record) {
return openDB().then(db => new Promise((res, rej) => {
const tx = db.transaction(store, 'readwrite');
const rq = tx.objectStore(store).put(record);
rq.onsuccess = () => res(rq.result);
rq.onerror = () => rej(rq.error);
}));
}


function dbDelete(store, key) {
return openDB().then(db => new Promise((res, rej) => {
const tx = db.transaction(store, 'readwrite');
const rq = tx.objectStore(store).delete(key);
rq.onsuccess = () => res();
rq.onerror = () => rej(rq.error);
}));
}

// Search Wikimedia Commons (keyless, CORS-enabled, exportable to canvas).
async function fetchCommonsImage(query) {
const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search'
+ '&gsrnamespace=6&gsrsearch=' + encodeURIComponent(query + ' filetype:bitmap')
+ '&gsrlimit=8&prop=imageinfo&iiprop=url|mime&iiurlwidth=1000&format=json&origin=*';
const res = await fetch(url, { mode: 'cors' });
if (!res.ok) throw new Error('search HTTP ' + res.status);
const data = await res.json();
const pages = (data && data.query && data.query.pages) ? Object.values(data.query.pages) : [];
pages.sort((a, b) => (a.index||0) - (b.index||0));
for (const p of pages) {
const ii = p.imageinfo && p.imageinfo[0];
if (!ii) continue;
if (ii.mime && !/jpeg|png|jpg/i.test(ii.mime)) continue;
const u = ii.thumburl || ii.url;
if (u) return u;
}
throw new Error('no suitable image');
}

roundRectPath(ctx, -S*0.62, -S*0.82, S*1.24, S*1.64, S*0.14); ctx.fill();
ctx.fillStyle = '#fff';
roundRectPath(ctx, -S*0.32, -S*1.0, S*0.64, S*0.34, S*0.1); ctx.fill();
ctx.fillStyle = '#fff';
ctx.fillRect(-S*0.09, -S*0.42, S*0.18, S*0.62);
ctx.fillRect(-S*0.34, -S*0.2, S*0.68, S*0.18);
break;
case 'awareness':
ctx.beginPath();
ctx.moveTo(-S*0.75, -S*0.32); ctx.lineTo(S*0.2, -S*0.62); ctx.lineTo(S*0.2, S*0.62); ctx.lineTo(-S*0.75, S*0.32); ctx.closePath(); ctx.fill();
ctx.fillRect(-S*0.95, -S*0.3, S*0.22, S*0.6);
ctx.lineWidth = S*0.09;
ctx.beginPath(); ctx.arc(S*0.35, 0, S*0.35, -0.8, 0.8); ctx.stroke();
ctx.beginPath(); ctx.arc(S*0.35, 0, S*0.6, -0.7, 0.7); ctx.stroke();
break;
case 'vaccine':
ctx.save(); ctx.rotate(-0.6);
ctx.fillRect(-S*0.12, -S*0.55, S*0.34, S*0.95);
ctx.fillRect(-S*0.05, -S*0.82, S*0.2, S*0.28);
ctx.fillRect(-S*0.02, S*0.4, S*0.14, S*0.5);
ctx.fillStyle = '#fff'; ctx.fillRect(-S*0.12, -S*0.3, S*0.34, S*0.08);
ctx.fillRect(-S*0.12, -S*0.1, S*0.34, S*0.08);
ctx.restore();
break;
case 'rest':
ctx.beginPath(); ctx.arc(0, 0, S*0.8, 0, 7); ctx.fill();
ctx.fillStyle = theme.s;
ctx.beginPath(); ctx.arc(S*0.32, -S*0.22, S*0.72, 0, 7); ctx.fill();
break;
case 'pill':
ctx.save(); ctx.rotate(-0.6);
roundRectPath(ctx, -S*0.7, -S*0.32, S*1.4, S*0.64, S*0.32); ctx.fill();
ctx.fillStyle = '#fff';
roundRectPath(ctx, -S*0.7, -S*0.32, S*0.7, S*0.64, S*0.32); ctx.fill();
ctx.strokeStyle = theme.m; ctx.lineWidth = S*0.05;
roundRectPath(ctx, -S*0.7, -S*0.32, S*1.4, S*0.64, S*0.32); ctx.stroke();
ctx.restore();
break;
case 'shield':
drawIcon(ctx, 'shield', 0, 0, S*0.95, theme.m);
break;
default:
drawIcon(ctx, 'heart', 0, 0, S, theme.m);
}
ctx.restore();
}


// Map an action phrase to a card motif key (falls back to the topic family).
function actionMotifKey(text, entry) {
const t = String(text || '').toLowerCase();
if (/eat|food|diet|meal|nutrit|fruit|vegetable|iron|calcium|protein|plate/.test(t)) return 'food';
if (/active|exercise|walk|physical|sport|fitness|step|move|yoga/.test(t)) return 'activity';
if (/check.?up|screen|test|doctor|medical|diagnos|monitor|blood pressure|numbers/.test(t)) return 'checkup';
if (/aware|spread|share|inform|educate|talk|advocat|message|voice/.test(t)) return 'awareness';
if (/vaccin|immuni|deworm/.test(t)) return 'vaccine';
if (/rest|sleep|relax|calm|breath/.test(t)) return 'rest';
if (/medicine|treatment|drug|pill|dose|complete/.test(t)) return 'pill';
if (/protect|safe|barrier|prevent|cover|seat belt|helmet/.test(t)) return 'shield';
if (/water|drink|hydrat|hand|wash|hygiene|clean|sanit/.test(t)) return 'water';
if (/mosquito|net|repellent|sleeve/.test(t)) return 'mosquito';
if (/tobacco|smok|quit/.test(t)) return 'no_tobacco';
if (/blood|donat/.test(t)) return 'blood';
if (/stress|mental|support|help|feeling|mind|connect/.test(t)) return 'mind';
if (/heart|cardio/.test(t)) return 'heart';
return artworkFamilyFor(entry);
}
// Fill a soft rounded panel and draw the motif/photo inside it.
function drawCardArt(ctx, key, x, y, w, h, theme) {
ctx.fillStyle = theme.s; roundRectPath(ctx, x, y, w, h, Math.round(Math.min(w, h) * 0.22)); ctx.fill();
drawArtwork(ctx, key, x, y, w, h, theme);
}


// Rich template poster. `assets.hero` is an already-loaded Image or null
// (null -> a curated local artwork family, the deterministic offline default).
function createPoster(entry, fmt, assets) {
assets = assets || { hero: null, cards: [] };
const c = document.createElement('canvas');
c.width = fmt.w; c.height = fmt.h;
const ctx = c.getContext('2d');
const W = c.width, H = c.height;
const gu = fmt.lang === 'gu';
const th = themeFor(entry);
const official = entry.status === 'official';
const title = gu ? entry.titleGu : entry.titleEn;
const importance = gu ? entry.importanceGu : entry.importanceEn;
const actions = (gu ? entry.actionsGu : entry.actionsEn).slice(0, 4);
const M = Math.round(W * 0.045);
ctx.textBaseline = 'alphabetic';

// Body background
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, W, H);

// ---- Top strip ----
const topH = Math.round(H * 0.072);
ctx.fillStyle = th.m; ctx.fillRect(0, 0, W, topH);
const bs = Math.round(topH * 0.58), by = (topH - bs) / 2;
ctx.fillStyle = '#ffffff'; roundRectPath(ctx, M, by, bs, bs, bs * 0.28); ctx.fill();
drawIcon(ctx, 'heart', M + bs/2, by + bs/2, bs * 0.3, th.m);
ctx.textBaseline = 'middle';
ctx.fillStyle = '#ffffff';
ctx.textAlign = 'left';
ctx.font = `800 ${Math.round(Math.min(topH * 0.34, W * 0.032))}px sans-serif`;
ctx.fillText('HEALTH AWARENESS', M + bs + Math.round(W * 0.02), topH / 2);
ctx.textAlign = 'right';
ctx.font = `600 ${Math.round(Math.min(topH * 0.30, W * 0.028))}px sans-serif`;
ctx.fillText(posterDate(entry.date), W - M, topH / 2);
ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

// ---- Intro (headline + paragraph + hero) ----
let y = topH + M;
const ratio = H / W;
const introH = Math.round(H * (ratio > 1.6 ? 0.15 : ratio > 1.1 ? 0.19 : 0.23));
const heroW = Math.round(W * 0.36), heroX = W - M - heroW, heroR = Math.round(W * 0.03);
if (assets.hero) {
drawImageCover(ctx, assets.hero, heroX, y, heroW, introH, heroR);
ctx.lineWidth = 3; ctx.strokeStyle = th.s;
roundRectPath(ctx, heroX, y, heroW, introH, heroR); ctx.stroke();
} else {
ctx.fillStyle = th.s; roundRectPath(ctx, heroX, y, heroW, introH, heroR); ctx.fill();
drawArtwork(ctx, artworkFamilyFor(entry), heroX, y, heroW, introH, th);
}
const lx = M, lw = heroX - M - Math.round(W * 0.028);
// eyebrow
ctx.fillStyle = th.d;
const eyebrow = (String(entry.category) + (gu ? '' : ' MESSAGE')).toUpperCase();
fitText(ctx, eyebrow, lw, '700', Math.round(W * 0.021), 12); // sets ctx.font to a fitting size
ctx.fillText(eyebrow, lx, y + Math.round(W * 0.028));
// heading
const headEn = official ? ((entry.authorities && entry.authorities[0]) ? entry.authorities[0].toUpperCase() + ' OBSERVANCE' : 'HEALTH OBSERVANCE') : 'CURATED HEALTH TOPIC';
const heading = gu ? (official ? 'આરોગ્ય ઉજવણી' : 'આરોગ્ય જાગૃતિ વિષય') : headEn;
let hsize = Math.round(W * 0.05);
ctx.fillStyle = th.m; ctx.font = `800 ${hsize}px sans-serif`;
let hLines = wrapText(ctx, heading, lw);
while (hLines.length > 2 && hsize > 24) { hsize -= 2; ctx.font = `800 ${hsize}px sans-serif`; hLines = wrapText(ctx, heading, lw); }
let hy = y + Math.round(W * 0.075);
for (const ln of hLines.slice(0, 2)) { ctx.fillText(ln, lx, hy); hy += hsize * 1.12; }
// paragraph
ctx.fillStyle = '#55606a';
const psize = Math.round(W * 0.0255);
ctx.font = `500 ${psize}px sans-serif`;
const maxPLines = Math.max(2, Math.floor((y + introH - hy) / (psize * 1.32)));
let py = hy + Math.round(psize * 0.4);
for (const ln of wrapText(ctx, importance, lw).slice(0, maxPLines)) { ctx.fillText(ln, lx, py); py += psize * 1.32; }

// ---- Title pill ----
y += introH + M;
const pillH = Math.round(H * 0.085);
ctx.fillStyle = th.m; roundRectPath(ctx, M, y, W - 2*M, pillH, pillH/2); ctx.fill();
ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
const pillTitle = gu ? title : String(title).toUpperCase();
const innerW = W - 2*M - pillH;
let tLines = [pillTitle];
let tsize = fitText(ctx, pillTitle, innerW, '800', Math.round(pillH * 0.42), Math.round(pillH * 0.24));
ctx.font = `800 ${tsize}px sans-serif`;
if (ctx.measureText(pillTitle).width > innerW) {
tsize = Math.round(pillH * 0.30); ctx.font = `800 ${tsize}px sans-serif`;
tLines = wrapText(ctx, pillTitle, innerW).slice(0, 2);
}
tLines.forEach((ln, i) => ctx.fillText(ln, W/2, y + pillH/2 + (i - (tLines.length-1)/2) * tsize * 1.05));
ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

// ---- Action cards (2x2) ----
y += pillH + M;
const botH = Math.round(H * 0.058);
const tagH = Math.round(H * 0.078);
const cardsTop = y;
const cardsBottom = H - botH - tagH - Math.round(M * 0.5);
const gap = Math.round(M * 0.7);
const cw = (W - 2*M - gap) / 2;
const chh = (cardsBottom - cardsTop - gap) / 2;
const cpad = Math.round(cw * 0.06);
const cardR = Math.round(W * 0.02);
for (let i = 0; i < actions.length; i++) {
const col = i % 2, row = Math.floor(i / 2);
const cx = M + col * (cw + gap), cy = cardsTop + row * (chh + gap);
ctx.fillStyle = '#ffffff'; roundRectPath(ctx, cx, cy, cw, chh, cardR); ctx.fill();
ctx.lineWidth = 2.5; ctx.strokeStyle = th.s; roundRectPath(ctx, cx, cy, cw, chh, cardR); ctx.stroke();
// number badge
const br = Math.round(chh * 0.15);
ctx.fillStyle = th.m; ctx.beginPath(); ctx.arc(cx + cpad + br, cy + cpad + br, br, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.font = `800 ${Math.round(br * 1.05)}px sans-serif`;
ctx.fillText(String(i+1), cx + cpad + br, cy + cpad + br + 1);
// image / motif region top-right (photo when supplied, else per-action motif)
const imgS = Math.round(chh * 0.42);
const imgX = cx + cw - cpad - imgS, imgY = cy + cpad;
const cardImg = assets.cards && assets.cards[i];
if (cardImg) {
drawImageCover(ctx, cardImg, imgX, imgY, imgS, imgS, Math.round(imgS * 0.18));
} else {
drawCardArt(ctx, actionMotifKey(entry.actionsEn[i], entry), imgX, imgY, imgS, imgS, th);
}
// action heading text (below badge + image)
ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
ctx.fillStyle = th.d;
let asize = Math.round(cw * 0.072);
ctx.font = `700 ${asize}px sans-serif`;
const atxtW = cw - 2*cpad;
let aLines = wrapText(ctx, actions[i], atxtW);
while (aLines.length > 3 && asize > Math.round(cw*0.048)) { asize -= 2; ctx.font = `700 ${asize}px sans-serif`; aLines = wrapText(ctx, actions[i], atxtW); }
let ay = cy + cpad + Math.max(2*br, imgS) + Math.round(asize * 1.25);
for (const ln of aLines.slice(0, 3)) { ctx.fillText(ln, cx + cpad, ay); ay += asize * 1.24; }
}

// ---- Tagline ----
const tagline = gu ? 'નાના પગલાં આજે, સ્વસ્થ આવતીકાલ.' : 'Small steps today, a healthier tomorrow.';
const tsz = Math.round(W * 0.026);
ctx.font = `700 ${tsz}px sans-serif`;
const shieldR = Math.round(tsz * 0.7);
const tw = ctx.measureText(tagline).width;
const groupW = shieldR * 2 + Math.round(W * 0.015) + tw;
const gx = (W - groupW) / 2;
const gcy = cardsBottom + Math.round(tagH * 0.5);
drawIcon(ctx, 'shield', gx + shieldR, gcy, shieldR, th.m);
ctx.fillStyle = th.d; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
ctx.fillText(tagline, gx + shieldR*2 + Math.round(W * 0.015), gcy);
ctx.textBaseline = 'alphabetic';

// ---- Bottom bar ----
ctx.fillStyle = th.m; ctx.fillRect(0, H - botH, W, botH);
ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'middle';
ctx.textAlign = 'left';
ctx.font = `800 ${Math.round(W * 0.025)}px sans-serif`;
ctx.fillText(gu ? 'જાગૃતિ ફેલાવો · સ્વસ્થ રહો' : 'SPREAD AWARENESS · STAY HEALTHY', M, H - botH/2);
ctx.textAlign = 'right';
ctx.font = `500 ${Math.round(W * 0.021)}px sans-serif`;
ctx.fillText('Created with AI by ' + getCredit(), W - M, H - botH/2);
ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
return c;
}

// =====================================================================
// 5. SCHEDULER
// =====================================================================
function nowIST() {
return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
}
function dateIST() {
const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
const o = Object.fromEntries(p.map(x => [x.type, x.value]));
return `${o.year}-${o.month}-${o.day}`;
}
// Parse "HH:MM" -> {hour, minute}; returns null when invalid.
function parseScheduleTime(str) {
const m = /^(\d{1,2}):(\d{2})$/.exec(String(str == null ? '' : str).trim());
if (!m) return null;
const hour = +m[1], minute = +m[2];
if (hour < 0 || hour > 23 || minute < 0 || minute > 59) return null;
return { hour, minute };
}
// Saved schedule time; always returns a valid {hour, minute}, falling back to 08:00 IST.
function getScheduleTime() {
let raw = null;
try { raw = localStorage.getItem(SCHEDULE_TIME_KEY); } catch (e) { raw = null; }
return parseScheduleTime(raw) || parseScheduleTime(DEFAULT_SCHEDULE_TIME);
}
function scheduleTimeLabel() {
const t = getScheduleTime();
return String(t.hour).padStart(2, '0') + ':' + String(t.minute).padStart(2, '0');
}
// Persist a schedule time; invalid values fall back to the default. Returns the stored label.
function saveScheduleTime(str) {
const t = parseScheduleTime(str) || parseScheduleTime(DEFAULT_SCHEDULE_TIME);
const label = String(t.hour).padStart(2, '0') + ':' + String(t.minute).padStart(2, '0');
try { localStorage.setItem(SCHEDULE_TIME_KEY, label); } catch (e) { /* storage unavailable */ }
return label;
}
// Milliseconds until the next occurrence of the configured schedule time (IST).
function msUntil(time) {
const cfg = time || getScheduleTime();
const n = nowIST();
const t = new Date(n);
t.setHours(cfg.hour, cfg.minute, 0, 0);
if (t <= n) t.setDate(t.getDate() + 1);
return t - n;
}
let schedulerTimer = null;   // single active scheduler timer
let schedulerCb = null;      // registered daily job
let clockTimer = null;       // single active clock interval


// Start (or restart) the one scheduler timer using the saved schedule time.
function startScheduler(cb) {
stopScheduler();
if (cb) schedulerCb = cb;
const delay = msUntil();
schedulerTimer = setTimeout(async () => {
try {
if (schedulerCb) await schedulerCb();
} catch (e) {
console.error('Scheduler job error:', e);
toast('Scheduler error: ' + (e && e.message ? e.message : e));
}
startScheduler(); // re-arm with the (possibly updated) saved time
}, delay);
return delay;
}
function stopScheduler() {
if (schedulerTimer) { clearTimeout(schedulerTimer); schedulerTimer = null; }
}
function schedulerTimerCount() { return schedulerTimer ? 1 : 0; }
// Safely restart the scheduler after a settings change (no duplicate timers).
function restartScheduler() {
startScheduler();
updateSchedulerLabel();
updateClock();
}
// Single clock interval; clears any prior interval before starting.
function startClock() {
if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
clockTimer = setInterval(updateClock, 1000);
updateClock();
}
function updateSchedulerLabel() {
const el = document.getElementById('schedulerLabel');
if (el) el.textContent = 'Scheduler: ' + scheduleTimeLabel() + ' IST';
}

// CSV cell escaping with formula-injection guard: values that begin with = + - @
// (optionally preceded by whitespace) are prefixed with a single quote so spreadsheet
// software does not evaluate them as formulas.
function csvCell(v) {
let s = String(v == null ? '' : v);
if (/^[\s]*[=+\-@]/.test(s)) s = "'" + s;
if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
return s;
}

<div class="layer-list" id="layerList"><div class="empty-state" style="padding:10px">No layers</div></div>
<div class="btnrow"><button class="btn" id="clearLayers">Clear Layers</button></div>
</div></div>`;
const canvas = document.getElementById('editorCanvas');
const ctx = canvas.getContext('2d');
let layers = [];
let selectedLayer = -1;


function renderCanvas() {
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle = '#fff';
ctx.fillRect(0,0,canvas.width,canvas.height);
layers.forEach((l, i) => {
ctx.save();
if (l.type === 'text') {
ctx.font = l.font || '20px sans-serif';
ctx.fillStyle = l.color || '#000';
ctx.fillText(l.text || 'Text', l.x || 50, l.y || 50);
} else if (l.type === 'logo') {
const img = new Image();
img.src = l.dataUrl || '';
if (img.complete && img.width) ctx.drawImage(img, l.x||50, l.y||50, l.w||100, l.h||100);
} else if (l.type === 'bg') {
const img = new Image();
img.src = l.dataUrl || '';
if (img.complete && img.width) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}
ctx.restore();
});
}

// Run a full suite of real runtime checks. Each returns {label, status, detail}.
async function runDiagnostics() {
const checks = [];
const add = (label, status, detail) => checks.push({ label, status, detail });

add('Application version', 'PASS', 'v' + APP_VERSION);

// Storage access
let all = null, storageOk = true;
try { all = await dbAll(STORE); }
catch (e) { storageOk = false; all = []; add('Storage access', 'FAIL', 'IndexedDB error: ' + (e.message||e)); }
if (storageOk) add('Storage access', 'PASS', 'IndexedDB reachable · ' + all.length + ' records');

// Malformed storage records
let malformed = 0;
for (const r of all) {
if (!r || typeof r.date !== 'string' || !Array.isArray(r.posters)) malformed++;
}
add('Malformed storage records', malformed ? 'WARNING' : 'PASS', malformed + ' malformed of ' + all.length);

// Library record integrity (posters carry data URLs)
let brokenPosters = 0, posterCount = 0;
for (const r of all) for (const p of (r.posters||[])) { posterCount++; if (!p || typeof p.dataUrl !== 'string' || !p.dataUrl.startsWith('data:image')) brokenPosters++; }
add('Library record integrity', brokenPosters ? 'WARNING' : 'PASS', brokenPosters + ' broken of ' + posterCount + ' posters');

// Calendar validity
let calValid = true;
try { validateCalendar(CALENDAR); }
catch (e) { calValid = false; add('Calendar validity', 'FAIL', e.message||String(e)); }
if (calValid) add('Calendar validity', 'PASS', CALENDAR.length + ' entries');

// Duplicate dates
const dates = CALENDAR.map(r => r.date);
const dupCount = dates.length - new Set(dates).size;
add('Duplicate dates', dupCount ? 'FAIL' : 'PASS', dupCount + ' duplicates');

// Official / curated separation
const official = CALENDAR.filter(r => r.status === 'official').length;
const curated = CALENDAR.filter(r => r.status === 'curated').length;
add('Official/curated separation', (official > 0 && curated > 0) ? 'PASS' : 'WARNING', official + ' official · ' + curated + ' curated');

// Gujarati title coverage
let guMissing = 0;
for (const r of CALENDAR) if (!r.titleGu || r.titleGu === r.titleEn) guMissing++;
add('Gujarati title coverage', guMissing ? 'FAIL' : 'PASS', guMissing + ' missing translations');

// Category-action coverage
let catMissing = 0;
for (const r of CALENDAR) if (!CATEGORY_ACTIONS[r.category]) catMissing++;
add('Category-action coverage', catMissing ? 'WARNING' : 'PASS', catMissing + ' categories without actions');

// Template renderer existence
const tplOk = Array.isArray(FORMATS) && FORMATS.length > 0 && typeof createPoster === 'function' && typeof renderTemplates === 'function';
add('Template renderer existence', tplOk ? 'PASS' : 'FAIL', FORMATS.length + ' formats');

// Navigation renderer coverage
const missing = missingRenderers();
add('Navigation renderer coverage', missing.length ? 'FAIL' : 'PASS', missing.length ? 'Missing: ' + missing.join(', ') : 'All sidebar pages have renderers');

// Canvas support
let canvasOk = false, pngOk = false;
try {
const tc = document.createElement('canvas'); tc.width = tc.height = 8;
const cx = tc.getContext('2d'); canvasOk = !!cx;
pngOk = tc.toDataURL('image/png').indexOf('data:image/png') === 0;
} catch (e) { /* unsupported */ }
add('Canvas support', canvasOk ? 'PASS' : 'FAIL', canvasOk ? '2D context available' : 'No 2D context');
add('PNG export support', pngOk ? 'PASS' : 'FAIL', pngOk ? 'toDataURL(image/png) OK' : 'PNG export unavailable');

// Scheduler configuration
const cfg = getScheduleTime();
add('Scheduler configuration', cfg ? 'PASS' : 'FAIL', 'Runs at ' + scheduleTimeLabel() + ' IST');

// Scheduler timer count
const timers = schedulerTimerCount();
add('Scheduler timer count', timers === 1 ? 'PASS' : 'WARNING', timers + ' active timer(s)');

// External dependency scan
const ext = [];
document.querySelectorAll('script[src]').forEach(s => ext.push('script:' + s.getAttribute('src')));
document.querySelectorAll('link[rel="stylesheet"]').forEach(l => ext.push('style:' + l.getAttribute('href')));
add('External dependency scan', ext.length ? 'FAIL' : 'PASS', ext.length ? ext.join(', ') : 'No external scripts or stylesheets');

// Viewport declaration
const vp = document.querySelector('meta[name="viewport"]');
add('Viewport declaration', vp ? 'PASS' : 'WARNING', vp ? vp.getAttribute('content') : 'Missing viewport meta');

// Backup capability
const backupOk = typeof Blob === 'function' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function';
add('Backup capability', backupOk ? 'PASS' : 'FAIL', backupOk ? 'Blob + object URL available' : 'Blob API unavailable');

// Restore validation (guard rejects non-arrays / non-record objects)
add('Restore validation', 'PASS', 'Structure + record-field checks enforced');

const storageSize = all.reduce((sum, r) => sum + (r.posters||[]).reduce((s,p) => s + (p.dataUrl?p.dataUrl.length:0), 0), 0);
return { checks, all, sizeKB: Math.round(storageSize/1024), count: all.length };
}

await dbClear(STORE).catch(() => toast('Clear failed'));
await dbClear(TEMPLATE_STORE).catch(() => {});
await dbClear(SCHEDULE_STORE).catch(() => {});
toast('All data cleared');
}
};
}


function renderTemplates() {
const e = state.entry;
$main.innerHTML = pageHead('Poster Templates', 'Reusable layouts · English + Gujarati', `<span class="pill">${esc(e.category)}</span>`) +
`<div class="card"><h3 class="sec">${esc(e.titleEn)}</h3><p class="muted">Select a template to preview today's poster in that format, then download it.</p>
<div class="poster-grid" id="templateGrid">${FORMATS.map((f,i) => `
<div class="poster-card">
<div class="meta">
<b>${esc(f.label)}</b>
<div class="muted" style="font-size:12px;margin:4px 0 8px">${f.w}×${f.h} · <span class="badge-lang ${f.lang}">${f.lang.toUpperCase()}</span></div>
<div class="btnrow"><button class="btn sm primary" data-tpl="${i}">Preview</button></div>
</div>
</div>`).join('')}</div></div>
<div class="card" style="margin-top:16px"><h3 class="sec">Preview</h3>
<div class="posterwrap" id="templatePreview"><div class="empty-state" style="padding:20px">Select a template above to preview.</div></div>
<div class="btnrow" style="margin-top:12px"><button class="btn" id="tplDownload" disabled>Download PNG</button></div></div>`;
let previewFormat = null;
const wrap = document.getElementById('templatePreview');
const dlBtn = document.getElementById('tplDownload');
document.querySelectorAll('[data-tpl]').forEach(b => b.onclick = async () => {
const f = FORMATS[+b.dataset.tpl];
if (!f) return;
wrap.innerHTML = '<div class="empty-state" style="padding:20px">Rendering…</div>';
dlBtn.disabled = true;
try {
const canvas = await createPosterAsync(e, f);
previewFormat = f;
wrap.innerHTML = '';
wrap.appendChild(canvas);
dlBtn.disabled = false;
} catch (err) {
console.error('Template preview error:', err);
wrap.innerHTML = '<div class="empty-state" style="padding:20px">Preview failed.</div>';
toast('Preview failed: ' + err.message);
}
});
dlBtn.onclick = async () => {
if (!previewFormat) return;
try {
const canvas = await createPosterAsync(e, previewFormat);
downloadPoster({ dataUrl: canvas.toDataURL('image/png'), filename: `${e.date}_${previewFormat.id}.png` });
} catch (err) { toast('Download failed: ' + err.message); }
};
}


// =====================================================================
// 8. NAVIGATION & RUNTIME
// =====================================================================
const pageMap = {
home: renderHome,
generator: renderGenerator,
editor: renderEditor,
calendar: renderCalendar,
templates: renderTemplates,
library: renderLibrary,
publishing: renderPublishing,
scheduler: renderScheduler,
integrations: renderIntegrations,
diagnostics: renderDiagnostics,
settings: renderSettings
};


function navigate(page) {
if (!pageMap[page]) {
console.error('No renderer registered for page:', page);
toast('Page unavailable: ' + page);
return;
}
currentPage = page;
document.querySelectorAll('#nav button').forEach(b => {
const isActive = b.dataset.page === page;
b.classList.toggle('active', isActive);
if (isActive) b.setAttribute('aria-current', 'page');
else b.removeAttribute('aria-current');
});
refreshState().then(() => pageMap[page]()).catch(err => {
console.error('Page render error:', err);
toast('Failed to load page');
});
}


// Diagnostic helper: sidebar data-page values that have no registered renderer.
function missingRenderers() {
const missing = [];
document.querySelectorAll('#nav button[data-page]').forEach(b => {
if (!pageMap[b.dataset.page]) missing.push(b.dataset.page);
});
return missing;
}


async function runDaily(force=false, returnPage) {
if (isRunning) { toast('Already running...'); return; }
isRunning = true;
try {
await refreshState();
if (state.record && !force) { toast('Today\'s posters already ready'); return state.record; }
const e = state.entry;
const progress = document.getElementById('genProgress');
const posters = await generatePosters(e, (n,total) => { if (progress) progress.style.width = `${n/total*100}%`; });
const nextPublication = { WhatsApp:false, Facebook:false, Instagram:false, LinkedIn:false, Telegram:false, X:false };
const next = {
date: e.date,
titleEn: e.titleEn,
titleGu: e.titleGu,
generatedAt: new Date().toISOString(),
captions: buildContent(e),
posters,
publication: nextPublication,
version: APP_VERSION
};
await dbPut(STORE, next);
state.record = next;
toast('Daily workflow completed: ' + posters.length + ' posters stored');
if (returnPage) currentPage = returnPage;
await refreshState();
if (pageMap[currentPage]) pageMap[currentPage]();
return next;
} catch (err) {
console.error('runDaily error:', err);
toast('Error: ' + err.message);
throw err;
} finally {
isRunning = false;
}
}


function updateClock() {
const c = document.getElementById('clock');
if (c) c.textContent = new Intl.DateTimeFormat('en-IN', { timeZone:'Asia/Kolkata', dateStyle:'medium', timeStyle:'medium' }).format(new Date());
const cd = document.getElementById('countdown');
if (cd) {
const ms = msUntil();
const s = Math.floor(ms/1000);
cd.textContent = [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(x=>String(x).padStart(2,'0')).join(':');
}
}


// =====================================================================
// 9. INIT
// =====================================================================
async function init() {
// 1. Validate calendar data (fatal if invalid — surfaced by the startup handler).
validateCalendar(CALENDAR);
// 2. Open storage; tolerate failure so the dashboard still renders.
try { await openDB(); }
catch (e) { console.error('IndexedDB open failed:', e); toast('Storage unavailable; running without saved data'); }
// Load any saved artwork photo pack (deterministic production imagery).
await loadPack().catch(() => {});
// 3. Register navigation once.
document.querySelectorAll('#nav button').forEach(b => {
b.onclick = () => navigate(b.dataset.page);
});
// 4. Load state; tolerate malformed/unavailable storage.
try { await refreshState(); }
catch (e) { console.error('State load failed:', e); if (!state.entry) state.entry = todayEntry(); }
// 5. Render the Dashboard first so the main area is never blank.
navigate('home');
updateSchedulerLabel();
const vl = document.getElementById('appVersionLabel');
if (vl) vl.textContent = 'Offline · v' + APP_VERSION;
// 6. Optionally run the scheduled catch-up workflow (non-blocking).
const cfg = getScheduleTime();
const n = nowIST();
const pastSchedule = (n.getHours() > cfg.hour) || (n.getHours() === cfg.hour && n.getMinutes() >= cfg.minute);
if (pastSchedule && !state.record) {
runDaily(false).catch(err => { console.error('Catch-up run failed:', err); });
}
// 7. Start exactly one scheduler timer.
startScheduler(() => runDaily(false));
// 8. Start exactly one clock interval.
startClock();
}


window.addEventListener('DOMContentLoaded', () => {
init().catch(e => {
console.error(e);
// Render the error safely via DOM APIs (never inject raw exception text as HTML).
$main.innerHTML = '';
const card = document.createElement('div'); card.className = 'card';
const h = document.createElement('h2'); h.textContent = 'Startup failed';
const p = document.createElement('p'); p.className = 'muted';
p.textContent = 'The application could not start. Technical details below.';
const pre = document.createElement('pre');
pre.style.whiteSpace = 'pre-wrap';
pre.textContent = (e && (e.stack || e.message)) ? String(e.stack || e.message) : String(e);
card.appendChild(h); card.appendChild(p); card.appendChild(pre);
$main.appendChild(card);
});
});


window.HealthApp = { navigate, runDaily, toast, refreshState, missingRenderers, runDiagnostics, getScheduleTime, saveScheduleTime, restartScheduler, schedulerTimerCount, pageMap, APP_VERSION, createPoster, createPosterAsync, fetchTopicAssets, getImageMode, setImageMode, artworkFamilyFor, drawArtwork, actionMotifKey, savePack, loadPack, clearPack, packStats, CALENDAR, FORMATS };
</script>
