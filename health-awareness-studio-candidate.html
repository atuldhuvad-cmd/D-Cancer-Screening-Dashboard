Theme: White / Green / Medical Blue.

:root {
--green: #1a9f6e; --green-dark: #0f7a52; --green-soft: #e7f6ef;
--blue: #1668c1; --blue-soft: #e8f1fb;
--ink: #1f2a33; --muted: #65727d; --line: #e6ebef; --bg: #f4f7f9;
--card: #ffffff; --warn: #d98a1a; --danger: #d9482b;
--radius: 16px; --shadow: 0 1px 2px rgba(16,40,60,.05),0 6px 18px rgba(16,40,60,.06);
--font: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14.5px; line-height: 1.5; }
button { font-family: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

/* Sidebar */
.side {
background: linear-gradient(180deg, #0f7a52, #0c6647);
color: #eafaf3;
padding: 18px 14px;
position: sticky;
top: 0;
height: 100vh;
overflow: auto;
z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.brand .logo {
width: 38px; height: 38px; border-radius: 10px; background: #fff;
display: grid; place-items: center; color: var(--green-dark);
font-weight: 800; font-size: 20px;
}
.brand h1 { font-size: 15px; margin: 0; line-height: 1.15; font-weight: 700; }
.brand small { color: #bfe6d6; font-size: 11px; font-weight: 500; }
.nav { margin-top: 16px; display: flex; flex-direction: column; gap: 2px; }
.nav button {
display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
background: transparent; border: 0; color: #dff5ea; padding: 10px 12px;
border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500;
}
.nav button .ic { width: 20px; text-align: center; }
.nav button:hover { background: rgba(255,255,255,.09); }
.nav button.active { background: #fff; color: var(--green-dark); font-weight: 700; }
.side .foot { margin-top: 18px; font-size: 11px; color: #bfe6d6; border-top: 1px solid rgba(255,255,255,.15); padding-top: 12px; }

/* Main */
.main { padding: 22px 26px 60px; overflow: auto; }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h2 { margin: 0; font-size: 20px; }
.page-head .sub { color: var(--muted); font-size: 13px; }
.searchbox { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 200px; }
.searchbox input { border: 0; outline: 0; flex: 1; font-size: 14px; background: transparent; }

.grid { display: grid; gap: 16px; }
.cards { grid-template-columns: repeat(4,1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .lbl { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.stat .val { font-size: 26px; font-weight: 800; line-height: 1; }
.stat .hint { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); }
.pill.blue { background: var(--blue-soft); color: var(--blue); }
.pill.warn { background: #fdf1e0; color: var(--warn); }
.pill.gray { background: #eef2f5; color: var(--muted); }
.pill.danger { background: #fbe9e5; color: var(--danger); }
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.col { flex: 1; min-width: 280px; }
h3.sec { font-size: 15px; margin: 0 0 12px; }
.btn {
display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line);
background: #fff; color: var(--ink); padding: 9px 14px; border-radius: 10px;
font-size: 13.5px; font-weight: 600; cursor: pointer; transition: .12s;
}
.btn:hover { border-color: #cdd6dd; background: #fbfdfe; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.blue:hover { background: #12569f; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: #c0392b; }
.btn.sm { padding: 6px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
label.fld { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 5px; }
input.inp, select.inp, textarea.inp { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 14px; font-family: inherit; outline: 0; background: #fff; }
input.inp:focus, select.inp:focus, textarea.inp:focus { border-color: var(--green); }
.field { margin-bottom: 14px; }
.muted { color: var(--muted); }
.kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 700; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { border: 1px solid var(--line); background: #fff; padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
.tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.posterwrap { background: #f0f4f6; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.posterwrap canvas, .posterwrap img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: var(--shadow); background: #fff; }
.thumbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
.thumb { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.thumb .imgbox { background: #eef3f5; display: grid; place-items: center; aspect-ratio: 1/1; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .meta { padding: 9px 10px; font-size: 11.5px; }
.thumb .meta b { display: block; font-size: 12px; margin-bottom: 3px; }
.thumb .actions { display: flex; gap: 6px; padding: 0 10px 10px; }
.thumb .actions .btn { padding: 5px 8px; font-size: 11px; flex: 1; justify-content: center; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th, table.tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
table.tbl th { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; }
.calgrid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.calcell { background: #fff; border: 1px solid var(--line); border-radius: 9px; min-height: 78px; padding: 7px; font-size: 11.5px; cursor: pointer; position: relative; }
.calcell:hover { border-color: var(--green); }
.calcell.empty { background: transparent; border: 0; cursor: default; }
.calcell .d { font-weight: 700; color: var(--muted); }
.calcell.today { outline: 2px solid var(--green); }
.calcell .ev { margin-top: 4px; font-weight: 600; line-height: 1.25; color: var(--ink); font-size: 10.5px; }
.calcell .cat { position: absolute; bottom: 6px; left: 7px; width: 8px; height: 8px; border-radius: 50%; }
.dow { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin-bottom: 6px; }
.dow div { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.captionbox { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; margin-bottom: 12px; }
.captionbox .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.captionbox pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; margin: 0; color: #2b3843; }
.bar { height: 8px; background: #eef2f5; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; font-size: 12px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .25s; z-index: 9999; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-state .big { font-size: 40px; margin-bottom: 8px; }
.countdown { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 22px; color: var(--blue); }
.badge-lang { font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px; }
.badge-lang.en { background: var(--blue-soft); color: var(--blue); }
.badge-lang.gu { background: var(--green-soft); color: var(--green-dark); }
.workflow { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
.workflow-step { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; font-size: 12px; }
.workflow-step.done { border-color: var(--green); background: var(--green-soft); }
.workflow-step.active { outline: 2px solid var(--blue); }
.statusline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.poster-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 14px; }
.poster-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.poster-card img { width: 100%; display: block; background: #eef3f5; }
.poster-card .meta { padding: 10px; }
.notice { padding: 10px 12px; border-radius: 10px; background: #fff7e6; border: 1px solid #f2d391; font-size: 12.5px; }
.progress { height: 8px; background: #e8edf1; border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); width: 0; }
.flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.gap-4 { gap: 4px; }
.editor-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.editor-tools .btn { font-size: 12px; padding: 6px 10px; }
.layer-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: #fafcfc; }
.layer-item { display: flex; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
.layer-item:hover { background: var(--bg); }
.layer-item.active { background: var(--blue-soft); font-weight: 600; }
.diag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; }
.diag-card { padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.diag-card .val { font-size: 28px; font-weight: 800; }
.diag-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
.diag-card.ok { border-left: 4px solid var(--green); }
.diag-card.warn { border-left: 4px solid var(--warn); }
.diag-card.err { border-left: 4px solid var(--danger); }
.modal-backdrop { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:999; }
.modal { background:#fff; border-radius:16px; padding:24px; max-width:520px; width:90%; max-height:90vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.2); }
.modal h3 { margin:0 0 12px; }
.modal .btnrow { margin-top:16px; }
@media (max-width:1080px) { .cards { grid-template-columns: repeat(2,1fr); } }
@media (max-width:860px) { .app { grid-template-columns: 1fr; } .side { position: static; height: auto; } .nav { flex-direction: row; flex-wrap: wrap; } }
@media (max-width:600px) { .cards { grid-template-columns: 1fr; } .workflow { grid-template-columns: 1fr; } }
</style>
</head>

function buildFixedCalendar() {
const calendar = [];
const start = new Date('2026-01-01T00:00:00Z');
const end = new Date('2026-12-31T00:00:00Z');
let curatedIdx = 0;
for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
const dateStr = d.toISOString().slice(0, 10);
const off = OFFICIAL_DAYS[dateStr];
let entry;
if (off) {
entry = { date: dateStr, category: off.category, titleEn: off.titleEn, importanceEn: off.importanceEn, authorities: off.authorities || [], status: 'official' };
} else {
const theme = CURATED_THEMES[curatedIdx % CURATED_THEMES.length];
curatedIdx++;
entry = { date: dateStr, category: theme.category, titleEn: theme.titleEn, importanceEn: theme.importanceEn, authorities: [], status: 'curated' };
}
entry.titleGu = GUJ_TITLE[entry.titleEn] || entry.titleEn;
entry.importanceGu = GUJ_IMP[entry.importanceEn] || entry.importanceEn;
entry.categoryGu = GUJ_CAT[entry.category] || entry.category;
const actions = CATEGORY_ACTIONS[entry.category] || CATEGORY_ACTIONS['Health'];
entry.actionsEn = actions.slice(0, 4);
entry.actionsGu = entry.actionsEn.map(a => GUJ_ACTION[a] || a);
entry.hashtags = (entry.titleEn.match(/[A-Za-z]+/g)||[]).slice(0,3).map(w=>w[0].toUpperCase()+w.slice(1));
if (entry.hashtags.length) entry.hashtags[0] = entry.hashtags[0] + 'Day';
const catIconMap = {
'Health':'heart','Health & Nutrition':'apple','Physical Activity':'walk','Public Health':'shield',
'Health & Inclusion':'heart','Mental & Physical Health':'brain','National':'flag',
'Language & Culture':'book','Mental Health':'brain','Reproductive & Maternal Health':'mom',
'Child Health':'child','Adolescent Health':'teen','Healthy Ageing':'elder',
'Safety & Injury Prevention':'shield','Vector-Borne Disease':'mosquito',
'Communicable Disease':'virus','Immunization':'syringe','Nutrition':'apple',
"Women's Health":'woman',"Men's Health":'man','Environment':'leaf',
'Science & Inclusion':'microscope','Communication':'megaphone','Social':'handshake',
'Emergency Preparedness':'firstaid','National & Labour':'flag','Media':'news',
'Health & Humanitarian':'heart','Family & Social':'family','National & Science':'atom',
'Consumer Affairs':'cart','Agriculture':'plant','Health & Environment':'leaf',
'National & Education':'cap','National & Legal':'gavel','Science':'microscope',
'National & Media':'newspaper','Environment & Livelihood':'tree','Environment & Agriculture':'plant',
'Governance':'building','Rights':'scales','Environment & Energy':'sun',
'National & Economy':'money','Health & Sports':'sport','National & Social':'community',
'Peace':'peace','Water Safety':'water','Education & Skills':'graduation',
'Health & Family':'family','Health & International':'globe','Humanitarian':'help',
'National & Agriculture':'tractor','National & Consumer Affairs':'shopping',
'National & Governance':'government','National & Language':'language',
'National & Peace':'peace','Occupational Health':'helmet','Health & Rights':'justice',
'National & Health':'cross','Culture':'book','Education':'cap','Safety':'shield',
'Health & Peace':'peace','Environment & Tourism':'tree','Health & National':'cross',
'Health & Social':'heart'
};
entry.icon = catIconMap[entry.category] || 'heart';
calendar.push(entry);
}
return calendar;
}

function validateCalendar(cal) {
if (cal.length !== 365) throw new Error('Calendar must have 365 entries');
const dateSet = new Set(cal.map(r => r.date));
if (dateSet.size !== 365) throw new Error('Duplicate dates');
const expected = [];
for (let d = new Date('2026-01-01T00:00:00Z'); d <= new Date('2026-12-31T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 1)) {
expected.push(d.toISOString().slice(0, 10));
}
for (const e of expected) if (!dateSet.has(e)) throw new Error('Missing date: ' + e);
const implIcons = new Set(['cross','heart','leaf','flag','apple','walk','shield','brain','book','mom','child','teen','elder','mosquito','virus','syringe','microscope','megaphone','handshake','firstaid','news','family','atom','cart','plant','cap','gavel','newspaper','tree','building','scales','sun','money','sport','community','peace','water','graduation','globe','help','tractor','shopping','government','language','helmet','justice','venus','woman','man']);
for (const r of cal) {
if (!r.titleGu || r.titleGu === r.titleEn) throw new Error(r.date + ': missing Gujarati title');
if (!r.importanceGu || r.importanceGu === r.importanceEn) throw new Error(r.date + ': missing Gujarati importance');
if (!r.categoryGu || r.categoryGu === r.category) throw new Error(r.date + ': missing Gujarati category');
if (r.actionsEn.length !== 4 || r.actionsGu.length !== 4) throw new Error(r.date + ': need 4 actions');
r.actionsEn.forEach((a, i) => { if (!r.actionsGu[i] || r.actionsGu[i] === a) throw new Error(r.date + ': action "'+a+'" missing translation'); });
if (!implIcons.has(r.icon)) throw new Error(r.date + ': unsupported icon "'+r.icon+'"');
}
}
const CALENDAR = (() => { const c = buildFixedCalendar(); validateCalendar(c); return c; })();

// 2. STORAGE (IndexedDB)
// =====================================================================
const DB_NAME = 'HealthAwarenessStudio';
const DB_VER = 2;
const STORE = 'dailyRuns';
const TEMPLATE_STORE = 'templates';
const SCHEDULE_STORE = 'schedules';
let dbp = null;

function openDB() {
if (dbp) return dbp;
dbp = new Promise((resolve, reject) => {
const req = indexedDB.open(DB_NAME, DB_VER);
req.onupgradeneeded = (ev) => {
const db = ev.target.result;
if (!db.objectStoreNames.contains(STORE)) {
const os = db.createObjectStore(STORE, { keyPath: 'date' });
os.createIndex('titleEn', 'titleEn');
}
if (!db.objectStoreNames.contains(TEMPLATE_STORE)) {
db.createObjectStore(TEMPLATE_STORE, { keyPath: 'id', autoIncrement: true });
}
if (!db.objectStoreNames.contains(SCHEDULE_STORE)) {
db.createObjectStore(SCHEDULE_STORE, { keyPath: 'id', autoIncrement: true });
}
};
req.onsuccess = () => resolve(req.result);
req.onerror = () => reject(req.error);
});
return dbp;
}

function dbGet(store, key) {
return openDB().then(db => new Promise((res, rej) => {
const tx = db.transaction(store, 'readonly');
const rq = tx.objectStore(store).get(key);
rq.onsuccess = () => res(rq.result || null);
rq.onerror = () => rej(rq.error);
}));
}

function dbPut(store, record) {
return openDB().then(db => new Promise((res, rej) => {
const tx = db.transaction(store, 'readwrite');
const rq = tx.objectStore(store).put(record);
rq.onsuccess = () => res(rq.result);
rq.onerror = () => rej(rq.error);
}));
}

function dbDelete(store, key) {
return openDB().then(db => new Promise((res, rej) => {
const tx = db.transaction(store, 'readwrite');
const rq = tx.objectStore(store).delete(key);
rq.onsuccess = () => res();
rq.onerror = () => rej(rq.error);
}));
}

function dbAll(store) {
return openDB().then(db => new Promise((res, rej) => {
const rq = db.transaction(store).objectStore(store).getAll();
rq.onsuccess = () => res(rq.result || []);
rq.onerror = () => rej(rq.error);
}));
}

function dbClear(store) {
return openDB().then(db => new Promise((res, rej) => {
const rq = db.transaction(store, 'readwrite').objectStore(store).clear();
rq.onsuccess = () => res();
rq.onerror = () => rej(rq.error);
}));
}

// 4. POSTER GENERATOR
// =====================================================================
const FORMATS = [
{ id: 'square-en', label: 'English Square', lang: 'en', w: 1080, h: 1080 },
{ id: 'square-gu', label: 'Gujarati Square', lang: 'gu', w: 1080, h: 1080 },
{ id: 'portrait-en', label: 'English Portrait', lang: 'en', w: 1080, h: 1350 },
{ id: 'portrait-gu', label: 'Gujarati Portrait', lang: 'gu', w: 1080, h: 1350 },
{ id: 'story-en', label: 'English Story', lang: 'en', w: 1080, h: 1920 },
{ id: 'story-gu', label: 'Gujarati Story', lang: 'gu', w: 1080, h: 1920 }
];

function wrapText(ctx, text, maxW) {
const words = String(text).split(/\s+/);
const lines = [];
let cur = '';
for (const w of words) {
const t = cur ? cur + ' ' + w : w;
if (ctx.measureText(t).width > maxW && cur) {
lines.push(cur);
cur = w;
} else {
cur = t;
}
}
if (cur) lines.push(cur);
return lines;
}

function drawIcon(ctx, type, x, y, r, color) {
ctx.save(); ctx.translate(x, y);
ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = r * 0.14;
switch (type) {
case 'heart':
ctx.beginPath();
ctx.moveTo(0, r*0.6);
ctx.bezierCurveTo(-r, -r*0.1, -r*0.55, -r*0.9, 0, -r*0.35);
ctx.bezierCurveTo(r*0.55, -r*0.9, r, -r*0.1, 0, r*0.6);
ctx.fill(); break;
case 'woman': case 'man':
ctx.beginPath();
ctx.arc(0, -r*0.35, r*0.3, 0, Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.moveTo(0, -r*0.05);
ctx.lineTo(0, r*0.65);
ctx.moveTo(-r*0.45, r*0.15);
ctx.lineTo(r*0.45, r*0.15);
ctx.stroke(); break;
case 'leaf':
ctx.beginPath();
ctx.ellipse(0, 0, r*0.7, r*0.45, -0.6, 0, Math.PI*2);
ctx.fill(); break;
case 'flag':
ctx.fillRect(-r*0.45, -r*0.65, r*0.12, r*1.3);
ctx.fillRect(-r*0.3, -r*0.6, r*0.8, r*0.45); break;
case 'water':
ctx.beginPath();
ctx.moveTo(0, -r*0.8);
ctx.bezierCurveTo(r*0.7, 0, r*0.55, r*0.8, 0, r*0.8);
ctx.bezierCurveTo(-r*0.55, r*0.8, -r*0.7, 0, 0, -r*0.8);
ctx.fill(); break;
default: // cross
ctx.fillRect(-r*0.18, -r*0.65, r*0.36, r*1.3);
ctx.fillRect(-r*0.65, -r*0.18, r*1.3, r*0.36);
}
ctx.restore();
}

function createPoster(entry, fmt) {
const c = document.createElement('canvas');
c.width = fmt.w; c.height = fmt.h;
const ctx = c.getContext('2d');
const gu = fmt.lang === 'gu';
const title = gu ? entry.titleGu : entry.titleEn;
const importance = gu ? entry.importanceGu : entry.importanceEn;
const actions = gu ? entry.actionsGu : entry.actionsEn;
const accent = entry.status === 'official' ? '#1668c1' : '#1a9f6e';
ctx.fillStyle = '#f7fbfa';
ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle = accent;
ctx.fillRect(0,0,c.width, Math.round(c.height*0.16));
ctx.fillStyle = '#fff';
ctx.font = `700 ${Math.round(c.width*0.034)}px sans-serif`;
ctx.fillText('HEALTH AWARENESS STUDIO', 70, 90);
ctx.font = `500 ${Math.round(c.width*0.024)}px sans-serif`;
ctx.fillText(entry.date, 70, 135);
drawIcon(ctx, entry.icon, c.width-145, 95, 55, '#fff');

let y = Math.round(c.height*0.24);
ctx.fillStyle = '#1f2a33';
ctx.textAlign = 'center';
let size = Math.round(c.width*0.062);
ctx.font = `800 ${size}px sans-serif`;
let lines = wrapText(ctx, title, c.width-140);
while (lines.length > 4 && size > 38) { size -= 3; ctx.font = `800 ${size}px sans-serif`; lines = wrapText(ctx, title, c.width-140); }
for (const ln of lines) { ctx.fillText(ln, c.width/2, y); y += size*1.18; }
y += 35;
ctx.fillStyle = '#65727d';
ctx.font = `500 ${Math.round(c.width*0.029)}px sans-serif`;
for (const ln of wrapText(ctx, importance, c.width-180).slice(0,5)) { ctx.fillText(ln, c.width/2, y); y += 42; }
y += 35;
ctx.textAlign = 'left';
ctx.fillStyle = '#1f2a33';
ctx.font = `700 ${Math.round(c.width*0.031)}px sans-serif`;
actions.forEach((a, i) => {
const ay = y + i*92;
ctx.fillStyle = accent;
ctx.beginPath();
ctx.arc(100, ay-10, 22, 0, Math.PI*2);
ctx.fill();
ctx.fillStyle = '#fff';
ctx.textAlign = 'center';
ctx.font = '700 24px sans-serif';
ctx.fillText(String(i+1), 100, ay-2);
ctx.textAlign = 'left';
ctx.fillStyle = '#1f2a33';
ctx.font = `600 ${Math.round(c.width*0.027)}px sans-serif`;
const al = wrapText(ctx, a, c.width-210).slice(0,2);
al.forEach((ln,j) => ctx.fillText(ln, 145, ay+j*34));
});
ctx.fillStyle = accent;
ctx.fillRect(0, c.height-110, c.width, 110);
ctx.fillStyle = '#fff';
ctx.textAlign = 'center';
ctx.font = `700 ${Math.round(c.width*0.026)}px sans-serif`;
ctx.fillText(gu ? 'જાગૃતિ ફેલાવો • સ્વસ્થ રહો' : 'Spread awareness • Stay healthy', c.width/2, c.height-48);
return c;
}

async function generatePosters(entry, onProgress) {
const out = [];
for (let i=0; i<FORMATS.length; i++) {
const f = FORMATS[i];
const canvas = createPoster(entry, f);
const dataUrl = canvas.toDataURL('image/png');
out.push({ ...f, dataUrl, filename: `${entry.date}_${f.id}.png` });
if (onProgress) onProgress(i+1, FORMATS.length);
await new Promise(r => setTimeout(r, 0));
}
return out;
}

function safeFilename(name) {
return String(name || 'poster').replace(/[^\w.\-]+/g, '_').replace(/_+/g, '_').replace(/^[_.]+/, '').slice(0, 120) || 'poster.png';
}
function downloadPoster(p) {
const a = document.createElement('a');
a.href = p.dataUrl;
a.download = safeFilename(p.filename || 'poster.png');
a.click();
}

// Download every poster in a set. No external ZIP library is bundled (offline,
// no dependencies), so files are saved individually, spaced slightly apart to
// avoid the browser suppressing rapid successive downloads.
function downloadAll(posters) {
if (!posters || !posters.length) { toast('Nothing to download'); return; }
posters.forEach((p, i) => setTimeout(() => downloadPoster(p), i * 300));
toast(`Downloading ${posters.length} posters`);
}

// 5. SCHEDULER
// =====================================================================
function nowIST() {
return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
}
function dateIST() {
const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
const o = Object.fromEntries(p.map(x => [x.type, x.value]));
return `${o.year}-${o.month}-${o.day}`;
}
function msUntil(hour=8) {
const n = nowIST();
const t = new Date(n);
t.setHours(hour, 0, 0, 0);
if (t <= n) t.setDate(t.getDate()+1);
return t - n;
}
let schedulerTimer = null;

function startScheduler(cb, hour=8) {
stopScheduler();
const delay = msUntil(hour);
schedulerTimer = setTimeout(async () => {
await cb();
startScheduler(cb, hour);
}, delay);
return delay;
}
function stopScheduler() {
if (schedulerTimer) clearTimeout(schedulerTimer);
schedulerTimer = null;
}

function toast(msg) {

}

function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

// Clipboard copy with a fallback for file:// / insecure contexts where the
// async Clipboard API is unavailable.
async function copyText(text) {
try {
if (navigator.clipboard && navigator.clipboard.writeText) {
await navigator.clipboard.writeText(text);
toast('Caption copied');
return;
}
throw new Error('clipboard-unavailable');
} catch (err) {
try {
const ta = document.createElement('textarea');
ta.value = text;
ta.setAttribute('readonly', '');
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.focus(); ta.select();
const ok = document.execCommand('copy');
document.body.removeChild(ta);
toast(ok ? 'Caption copied' : 'Copy unavailable — please copy manually');
} catch (e2) {
toast('Copy unavailable in this browser');
}
}
}

// Simple canvas editor

function renderCanvas() {
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle = '#fff';
ctx.fillRect(0,0,canvas.width,canvas.height);
layers.forEach((l) => {
ctx.save();
if (l.type === 'text') {
ctx.font = l.font || '20px sans-serif';
ctx.fillStyle = l.color || '#000';
ctx.fillText(l.text || 'Text', l.x || 50, l.y || 50);
} else if (l.type === 'logo' || l.type === 'bg') {
// Cache a single Image per layer and redraw once it has decoded.
// Fixes the previous race (img.complete was checked before load) and
// the image-object leak (a new Image() was allocated on every redraw).
if (!l._img) {
l._img = new Image();
l._img.onload = () => renderCanvas();
l._img.onerror = () => { l._error = true; toast('Image failed to load'); };
l._img.src = l.dataUrl || '';
}
const img = l._img;
if (img.complete && img.naturalWidth) {
if (l.type === 'bg') {
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
} else {
ctx.drawImage(img, l.x||50, l.y||50, l.w||100, l.h||100);
}
}
}
ctx.restore();
});

<div class="btnrow"><button class="btn primary" id="addSchedule">Add Schedule</button></div>
<div class="notice" style="margin-top:12px">Recurring schedules are recorded here; automated delivery still depends on the daily 08:00 IST run while the app is open.</div></div>`;
document.getElementById('addSchedule').onclick = () => {
let freq = prompt('Frequency (daily/weekly/monthly):','daily');
if (freq === null) return;
freq = freq.trim().toLowerCase();
if (!['daily','weekly','monthly'].includes(freq)) { toast('Frequency must be daily, weekly or monthly'); return; }
let time = prompt('Time (HH:MM IST, 24-hour):','08:00');
if (time === null) return;
time = time.trim();
if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) { toast('Time must be 24-hour HH:MM'); return; }
dbPut(SCHEDULE_STORE, { freq, time, active: true, createdAt: new Date().toISOString() }).then(() => { toast('Schedule added'); renderScheduler(); });
};
dbAll(SCHEDULE_STORE).then(list => {
const el = document.getElementById('scheduleList');
if (!el) return;
el.innerHTML = list.length
? list.map(s => `<div class="kv"><span>${esc(s.freq)} at ${esc(s.time)} ${s.active?'✅':'⏸️'}</span><button class="btn sm" data-del="${esc(s.id)}">Delete</button></div>`).join('')
: '<div class="empty-state" style="padding:16px">No schedules yet.</div>';
el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
await dbDelete(SCHEDULE_STORE, +b.dataset.del);
renderScheduler();
});
});
}

function renderIntegrations() {
const settings = JSON.parse(localStorage.getItem('n8nSettings') || '{}');
$main.innerHTML = pageHead('n8n Integration', 'Webhook, queue, retry, timeout, error handling') +
`<div class="card"><div class="field"><label class="fld">Webhook URL</label><input class="inp" id="webhookUrl" value="${esc(settings.url||'')}" placeholder="https://n8n.example.com/webhook"></div>
<div class="field"><label class="fld">Retry attempts</label><input class="inp" id="retryCount" value="${settings.retry||3}" type="number"></div>
<div class="field"><label class="fld">Timeout (ms)</label><input class="inp" id="timeoutMs" value="${settings.timeout||5000}" type="number"></div>
<div class="btnrow"><button class="btn primary" id="saveN8n">Save</button><button class="btn" id="testN8n">Test Connection</button></div></div>`;
document.getElementById('saveN8n').onclick = () => {
const url = document.getElementById('webhookUrl').value.trim();
const retry = parseInt(document.getElementById('retryCount').value) || 3;
const timeout = parseInt(document.getElementById('timeoutMs').value) || 5000;
localStorage.setItem('n8nSettings', JSON.stringify({ url, retry, timeout }));
toast('n8n settings saved');
};
document.getElementById('testN8n').onclick = async () => {
const url = document.getElementById('webhookUrl').value.trim();
if (!url) { toast('Enter a webhook URL'); return; }
try {
const res = await fetch(url, { method: 'HEAD', signal: AbortSignal.timeout(5000) });
toast(res.ok ? 'Connection OK' : 'Connection failed (status: '+res.status+')');
} catch (e) {
toast('Error: '+e.message);
}
};
}

// Safe restore: validates the file, snapshots current data, and rolls back on
// any failure so a bad import can never erase valid existing records.
async function restoreBackup(text) {
let data;
try { data = JSON.parse(text); }
catch (err) { toast('Restore failed: invalid JSON — existing data preserved'); return false; }
let runs;
if (Array.isArray(data)) runs = data;                       // bare v5.0 array export
else if (data && Array.isArray(data.runs)) runs = data.runs; // v5.1 envelope
else { toast('Restore failed: unrecognised format — existing data preserved'); return false; }
const valid = runs.filter(r => r && typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date));
if (!valid.length) { toast('Restore failed: no valid records — existing data preserved'); return false; }

let snapshot;
try { snapshot = await dbAll(STORE); }
catch (err) { toast('Restore failed: cannot read current data — nothing changed'); return false; }

try {
for (const r of valid) {
const rec = {
date: r.date,
titleEn: typeof r.titleEn === 'string' ? r.titleEn : '',
titleGu: typeof r.titleGu === 'string' ? r.titleGu : '',
generatedAt: r.generatedAt || new Date().toISOString(),
captions: (r.captions && typeof r.captions === 'object') ? r.captions : null,
posters: Array.isArray(r.posters) ? r.posters.filter(p => p && typeof p.dataUrl === 'string' && p.dataUrl.startsWith('data:image')) : [],
publication: (r.publication && typeof r.publication === 'object') ? r.publication : {},
version: r.version || '5.1'
};
await dbPut(STORE, rec); // keyPath 'date' — same-date records overwrite, never duplicate
}
if (!Array.isArray(data) && Array.isArray(data.schedules)) {
const existing = await dbAll(SCHEDULE_STORE);
const seen = new Set(existing.map(s => s.freq + '|' + s.time));
for (const s of data.schedules) {
if (s && ['daily','weekly','monthly'].includes(s.freq) && /^([01]\d|2[0-3]):[0-5]\d$/.test(s.time || '') && !seen.has(s.freq + '|' + s.time)) {
seen.add(s.freq + '|' + s.time);
await dbPut(SCHEDULE_STORE, { freq: s.freq, time: s.time, active: s.active !== false, createdAt: s.createdAt || new Date().toISOString() });
}
}
}
await refreshState();
toast(`Restore complete: ${valid.length} record(s) merged`);
return true;
} catch (err) {
try {
await dbClear(STORE);
for (const r of snapshot) await dbPut(STORE, r);
toast('Restore failed and was rolled back — no data lost');
} catch (e2) {
toast('Restore error; rollback incomplete: ' + e2.message);
}
return false;
}
}

function renderDiagnostics() {
(async () => {
const checks = [];
const add = (name, status, detail) => checks.push({ name, status, detail });

add('Application init', (Array.isArray(CALENDAR) && CALENDAR.length > 0 && window.HealthApp) ? 'PASS' : 'FAIL', CALENDAR.length + ' calendar entries loaded');

let calStatus = 'PASS', calDetail = '365 unique valid dates';
try { validateCalendar(CALENDAR); }
catch (err) { calStatus = 'FAIL'; calDetail = err.message; }
add('Calendar integrity', calStatus, calDetail);

const dupSeen = new Set(), dup = new Set();
CALENDAR.forEach(r => { if (dupSeen.has(r.date)) dup.add(r.date); dupSeen.add(r.date); });
add('Duplicate dates', dup.size ? 'FAIL' : 'PASS', dup.size ? (dup.size + ' duplicate(s)') : 'None');

const missGu = CALENDAR.filter(r => !r.titleGu || r.titleGu === r.titleEn || !r.importanceGu || r.importanceGu === r.importanceEn || !r.categoryGu).length;
add('Translation coverage', missGu ? 'WARNING' : 'PASS', missGu ? (missGu + ' entry/entries missing Gujarati') : 'All entries have EN + GU');

const missAct = CALENDAR.filter(r => !Array.isArray(r.actionsEn) || r.actionsEn.length !== 4 || !Array.isArray(r.actionsGu) || r.actionsGu.length !== 4).length;
const missMap = [...new Set(CALENDAR.map(r => r.category))].filter(c => !CATEGORY_ACTIONS[c]).length;
add('Category-action coverage', (missAct || missMap) ? 'WARNING' : 'PASS', (missAct || missMap) ? (missAct + ' entries / ' + missMap + ' categories incomplete') : 'Every category has 4 bilingual actions');

const tplBad = FORMATS.filter(f => !f.id || !f.lang || !(f.w > 0) || !(f.h > 0)).length;
add('Template integrity', tplBad ? 'FAIL' : 'PASS', FORMATS.length + ' formats valid');

let runs = [], schedules = [], templates = [], dbStatus = 'PASS', dbDetail = '';
try {
runs = await dbAll(STORE);
schedules = await dbAll(SCHEDULE_STORE);
templates = await dbAll(TEMPLATE_STORE);
dbDetail = runs.length + ' run(s) readable';
} catch (err) { dbStatus = 'FAIL'; dbDetail = 'IndexedDB error: ' + err.message; }
add('IndexedDB access', dbStatus, dbDetail);

let lsStatus = 'PASS', lsDetail = 'read/write OK';
try { const k = '__has_probe__'; localStorage.setItem(k, '1'); localStorage.getItem(k); localStorage.removeItem(k); }
catch (err) { lsStatus = 'WARNING'; lsDetail = 'localStorage unavailable'; }
add('localStorage access', lsStatus, lsDetail);

add('Library records', 'PASS', runs.length + ' record(s), ' + runs.reduce((s, r) => s + ((r.posters || []).length), 0) + ' poster(s)');
add('Scheduler records', 'PASS', schedules.length + ' schedule(s), ' + templates.length + ' template store row(s)');

const badRuns = runs.filter(r => !r.date || !/^\d{4}-\d{2}-\d{2}$/.test(r.date) || !Array.isArray(r.posters));
add('Saved-object validity', badRuns.length ? 'WARNING' : 'PASS', badRuns.length ? (badRuns.length + ' malformed record(s)') : 'All records well-formed');

let canvasStatus = 'PASS', canvasDetail = '2D canvas + PNG export OK';
try {
const t = createPoster(state.entry, FORMATS[0]);
if (!t || typeof t.toDataURL !== 'function' || !t.toDataURL('image/png').startsWith('data:image/png')) throw new Error('canvas render failed');
} catch (err) { canvasStatus = 'FAIL'; canvasDetail = err.message; }
add('Poster canvas', canvasStatus, canvasDetail);

const exportOk = (typeof Blob !== 'undefined' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function');
add('Export capability', exportOk ? 'PASS' : 'FAIL', exportOk ? 'Blob + object URL available' : 'Blob/URL unavailable');
add('Backup capability', exportOk ? 'PASS' : 'FAIL', exportOk ? 'JSON export + validated restore ready' : 'Unavailable');

const vp = document.querySelector('meta[name="viewport"]');
add('Mobile viewport', (vp && /width=device-width/.test(vp.content || '')) ? 'PASS' : 'WARNING', vp ? (vp.getAttribute('content') || '') : 'No viewport meta');

const externals = [...document.querySelectorAll('script[src],link[href],img[src]')].filter(el => {
const u = el.getAttribute('src') || el.getAttribute('href') || '';
return /^(https?:)?\/\//i.test(u);
});
add('Offline / no external deps', externals.length ? 'FAIL' : 'PASS', externals.length ? (externals.length + ' external resource(s)') : 'No external resources referenced');

const cls = s => s === 'PASS' ? 'ok' : (s === 'WARNING' ? 'warn' : 'err');
const icon = s => s === 'PASS' ? '✅' : (s === 'WARNING' ? '⚠️' : '❌');
const fails = checks.filter(c => c.status === 'FAIL').length;
const warns = checks.filter(c => c.status === 'WARNING').length;
const overall = fails ? 'FAIL' : (warns ? 'WARNING' : 'PASS');
const storageBytes = runs.reduce((sum, r) => sum + (r.posters || []).reduce((s, p) => s + (p.dataUrl ? p.dataUrl.length : 0), 0), 0);

$main.innerHTML = pageHead('Diagnostics', 'Live health checks · PASS / WARNING / FAIL', `<span class="pill ${overall === 'PASS' ? '' : overall === 'WARNING' ? 'warn' : 'danger'}">${icon(overall)} ${overall}</span>`) +
`<div class="diag-grid">${checks.map(c => `<div class="diag-card ${cls(c.status)}"><div class="label">${esc(c.name)}</div><div class="val" style="font-size:20px">${icon(c.status)} ${esc(c.status)}</div><div class="muted">${esc(c.detail)}</div></div>`).join('')}</div>
<div class="card" style="margin-top:16px"><h3 class="sec">Storage</h3><div class="kv"><span>Estimated poster storage</span><b>${Math.round(storageBytes/1024)} KB</b></div><div class="kv"><span>Daily records</span><b>${runs.length}</b></div><div class="kv"><span>Checks</span><b>${checks.length - fails - warns} pass · ${warns} warning · ${fails} fail</b></div></div>
<div class="card" style="margin-top:16px"><h3 class="sec">Backup &amp; Restore</h3>
<div class="btnrow">
<button class="btn" id="exportBackup">Export Backup (JSON)</button>
<button class="btn" id="importBackup">Import / Restore</button>
<button class="btn danger" id="clearAll">Clear All Data</button>
</div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<div class="notice" style="margin-top:12px">Restore validates the file first, then merges records by date (no duplicates). A malformed or unreadable file is rejected and existing data is left untouched; any mid-restore error is rolled back.</div></div>`;

document.getElementById('exportBackup').onclick = () => {
const backup = { app: 'Health Awareness Studio', schema: DB_VER, version: '5.1', exportedAt: new Date().toISOString(), runs, schedules, templates };
const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url; a.download = safeFilename('has_backup_' + dateIST() + '.json'); a.click();
setTimeout(() => URL.revokeObjectURL(url), 1000);
toast('Backup exported');
};

const fileInput = document.getElementById('importFile');
document.getElementById('importBackup').onclick = () => fileInput.click();
fileInput.onchange = () => {
const file = fileInput.files && fileInput.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = async () => { await restoreBackup(String(reader.result)); fileInput.value = ''; renderDiagnostics(); };
reader.onerror = () => { toast('Could not read file'); fileInput.value = ''; };
reader.readAsText(file);
};

document.getElementById('clearAll').onclick = async () => {
if (!confirm('Delete all poster data? Consider exporting a backup first.')) return;
await dbClear(STORE);
state.record = null;
toast('All data cleared');
renderDiagnostics();
};
})();
}

function renderSettings() {
$main.innerHTML = pageHead('Settings', 'Scheduler and local data') +
`<div class="card"><div class="field"><label class="fld">Daily scheduler time (IST)</label><input class="inp" value="08:00" disabled></div>
<div class="kv"><span>Version</span><b>5.1</b></div>
<div class="kv"><span>Storage engine</span><b>IndexedDB (schema v${DB_VER})</b></div>
<div class="btnrow" style="margin-top:12px"><button class="btn danger" id="clearData">Clear local database</button></div>
<div class="notice" style="margin-top:12px">This removes every daily run, template and schedule from this browser. Export a backup from Diagnostics first if you may need the data.</div></div>`;
document.getElementById('clearData').onclick = async () => {
if (confirm('Delete all data? This cannot be undone.')) {
await dbClear(STORE);
await dbClear(TEMPLATE_STORE);
await dbClear(SCHEDULE_STORE);
state.record = null;
await refreshState();
toast('All data cleared');
}
};
}

// =====================================================================
// 8. NAVIGATION & RUNTIME
// =====================================================================
const pageMap = {
home: renderHome,
generator: renderGenerator,
editor: renderEditor,
templates: renderTemplates,
calendar: renderCalendar,
library: renderLibrary,
publishing: renderPublishing,
scheduler: renderScheduler,
integrations: renderIntegrations,
diagnostics: renderDiagnostics,
settings: renderSettings
};

function navigate(page) {
if (!pageMap[page]) { toast('Unknown page: ' + page); return; }
currentPage = page;
document.querySelectorAll('#nav button').forEach(b => {
const on = b.dataset.page === page;
b.classList.toggle('active', on);
b.setAttribute('aria-current', on ? 'page' : 'false');
});
refreshState().then(() => pageMap[page]());
}

async function runDaily(force=false, returnPage) {
await refreshState();
if (state.record && !force) { toast('Today\'s posters already ready'); return state.record; }
const e = state.entry;
const progress = document.getElementById('genProgress');
const posters = await generatePosters(e, (n,total) => { if (progress) progress.style.width = `${n/total*100}%`; });
const nextPublication = { WhatsApp:false, Facebook:false, Instagram:false, LinkedIn:false, Telegram:false, X:false };
const next = {
date: e.date,
titleEn: e.titleEn,
titleGu: e.titleGu,
generatedAt: new Date().toISOString(),
captions: buildContent(e),
posters,
publication: nextPublication,
version: '5.1'
};
await dbPut(STORE, next);
state.record = next;
toast('Daily workflow completed: 6 posters stored');
if (returnPage) currentPage = returnPage;
await refreshState();
if (pageMap[currentPage]) pageMap[currentPage]();
return next;
}

function updateClock() {
const c = document.getElementById('clock');
if (c) c.textContent = new Intl.DateTimeFormat('en-IN', { timeZone:'Asia/Kolkata', dateStyle:'medium', timeStyle:'medium' }).format(new Date());
const cd = document.getElementById('countdown');
if (cd) {
const ms = msUntil(8);
const s = Math.floor(ms/1000);
cd.textContent = [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(x=>String(x).padStart(2,'0')).join(':');
}
}

// =====================================================================
// 9. INIT
// =====================================================================
async function init() {
validateCalendar(CALENDAR);
await openDB();
// Bind nav
document.querySelectorAll('#nav button').forEach(b => {
b.onclick = () => navigate(b.dataset.page);
});
await refreshState();
const n = nowIST();
if (n.getHours() >= 8 && !state.record) {
await runDaily(false);
} else {
navigate('home');
}
startScheduler(() => runDaily(false), 8);
setInterval(updateClock, 1000);
updateClock();
}

window.addEventListener('DOMContentLoaded', () => {
init().catch(e => {
console.error(e);
$main.innerHTML = `<div class="card"><h2>Startup failed</h2><pre>${e.stack||e.message}</pre></div>`;
});
});

// Expose for debugging
window.HealthApp = { navigate, runDaily, toast, refreshState };
</script>
</body>
</html>
