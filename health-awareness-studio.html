<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Health Awareness Studio</title>
<meta name="description" content="Automated daily health-awareness poster generation for hospitals, NGOs, public-health departments and government campaigns." />
<style>
/* ============================================================
   Health Awareness Studio — self-contained, offline-capable.
   No external frameworks. Vanilla HTML/CSS/JS + IndexedDB.
   Theme: White / Green / Medical Blue.
   ============================================================ */
:root{
  --green:#1a9f6e; --green-dark:#0f7a52; --green-soft:#e7f6ef;
  --blue:#1668c1; --blue-soft:#e8f1fb;
  --ink:#1f2a33; --muted:#65727d; --line:#e6ebef; --bg:#f4f7f9;
  --card:#ffffff; --warn:#d98a1a; --danger:#d9482b; --ok:#1a9f6e;
  --radius:16px; --shadow:0 1px 2px rgba(16,40,60,.05),0 6px 18px rgba(16,40,60,.06);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,'Noto Sans',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.5}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* Sidebar */
.side{background:linear-gradient(180deg,#0f7a52,#0c6647);color:#eafaf3;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--green-dark);font-weight:800;font-size:20px}
.brand h1{font-size:15px;margin:0;line-height:1.15;font-weight:700}
.brand small{color:#bfe6d6;font-size:11px;font-weight:500}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#dff5ea;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
.nav button .ic{width:20px;text-align:center}
.nav button:hover{background:rgba(255,255,255,.09)}
.nav button.active{background:#fff;color:var(--green-dark);font-weight:700}
.side .foot{margin-top:18px;font-size:11px;color:#bfe6d6;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
/* Main */
.main{padding:22px 26px 60px;overflow:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:20px}
.topbar .sub{color:var(--muted);font-size:13px}
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:240px}
.searchbox input{border:0;outline:0;flex:1;font-size:14px;background:transparent}
/* cards */
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .val{font-size:26px;font-weight:800;line-height:1}
.stat .hint{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green-dark)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.warn{background:#fdf1e0;color:var(--warn)}
.pill.gray{background:#eef2f5;color:var(--muted)}
.pill.danger{background:#fbe9e5;color:var(--danger)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
h3.sec{font-size:15px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.12s}
.btn:hover{border-color:#cdd6dd;background:#fbfdfe}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.blue:hover{background:#12569f}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px}
input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:0;background:#fff}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--green)}
.field{margin-bottom:14px}
.muted{color:var(--muted)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.posterwrap{background:#f0f4f6;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.posterwrap canvas,.posterwrap img{max-width:100%;height:auto;border-radius:8px;box-shadow:var(--shadow);background:#fff}
.thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.thumb{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.thumb .imgbox{background:#eef3f5;display:grid;place-items:center;aspect-ratio:1/1;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .meta{padding:9px 10px;font-size:11.5px}
.thumb .meta b{display:block;font-size:12px;margin-bottom:3px}
.thumb .actions{display:flex;gap:6px;padding:0 10px 10px}
.thumb .actions .btn{padding:5px 8px;font-size:11px;flex:1;justify-content:center}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.tbl th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calcell{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:78px;padding:7px;font-size:11.5px;cursor:pointer;position:relative}
.calcell:hover{border-color:var(--green)}
.calcell.empty{background:transparent;border:0;cursor:default}
.calcell .d{font-weight:700;color:var(--muted)}
.calcell.today{outline:2px solid var(--green)}
.calcell .ev{margin-top:4px;font-weight:600;line-height:1.25;color:var(--ink);font-size:10.5px}
.calcell .cat{position:absolute;bottom:6px;left:7px;width:8px;height:8px;border-radius:50%}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow div{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.captionbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin-bottom:12px}
.captionbox .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.captionbox pre{white-space:pre-wrap;font-family:inherit;font-size:13px;margin:0;color:#2b3843}
.bar{height:8px;background:#eef2f5;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:999px}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:12px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:10px;height:10px;border-radius:3px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state .big{font-size:40px;margin-bottom:8px}
.hide{display:none!important}
.countdown{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;color:var(--blue)}
.badge-lang{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px}
.badge-lang.en{background:var(--blue-soft);color:var(--blue)}
.badge-lang.gu{background:var(--green-soft);color:var(--green-dark)}
@media (max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <!-- ===================== SIDEBAR ===================== -->
  <aside class="side">
    <div class="brand">
      <div class="logo">✚</div>
      <div>
        <h1>Health Awareness<br/>Studio</h1>
        <small>Daily poster automation</small>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-page="home" class="active"><span class="ic">🏠</span> Home</button>

  <!-- ===================== MAIN ===================== -->
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>

/* =====================================================================
   2. STORAGE — IndexedDB for posters, localStorage for settings/logs
   ===================================================================== */
const DB_NAME='has_db', STORE='posters';
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const rq=indexedDB.open(DB_NAME,1);
    rq.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        const os=db.createObjectStore(STORE,{keyPath:'id'});
        os.createIndex('date','date'); os.createIndex('language','language');
        os.createIndex('category','category');
      }
    };
    rq.onsuccess=e=>{_db=e.target.result;res(_db)};
    rq.onerror=e=>rej(e.target.error);
  });
}
async function dbPut(rec){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error);});}
async function dbAll(){const db=await openDB();return new Promise((res,rej)=>{const out=[];const tx=db.transaction(STORE,'readonly');tx.objectStore(STORE).openCursor().onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue();}else res(out);};tx.onerror=e=>rej(e.target.error);});}
async function dbGet(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const rq=tx.objectStore(STORE).get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e.target.error);});}
async function dbDelete(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error);});}

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function topicForDate(d){
  const m=d.getMonth()+1, day=d.getDate();
  const hit=AWARENESS.find(t=>t.month===m && t.day===day);
  if(hit) return hit;
  // deterministic fallback by day-of-year
  const start=new Date(d.getFullYear(),0,0);
  const doy=Math.floor((d-start)/86400000);
  return FALLBACKS[doy%FALLBACKS.length];
}
function fmtLongDate(d){
  return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function slug(s){return s.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');}

function drawIcon(ctx,type,cx,cy,r,color){
  ctx.save();ctx.translate(cx,cy);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=r*0.14;ctx.lineCap='round';ctx.lineJoin='round';

    case 'ribbon':{ctx.lineWidth=r*0.22;ctx.beginPath();ctx.moveTo(-s*0.35,s*0.9);ctx.quadraticCurveTo(0,-s*0.2,0,-s*0.7);ctx.stroke();ctx.beginPath();ctx.moveTo(s*0.35,s*0.9);ctx.quadraticCurveTo(0,-s*0.2,0,-s*0.7);ctx.stroke();break;}
    case 'lungs':{ctx.lineWidth=r*0.13;ctx.beginPath();ctx.moveTo(0,-s*0.8);ctx.lineTo(0,s*0.1);ctx.stroke();for(const sgn of [-1,1]){ctx.beginPath();ctx.moveTo(0,-s*0.2);ctx.quadraticCurveTo(sgn*s*0.15,s*0.0,sgn*s*0.5,s*0.15);ctx.quadraticCurveTo(sgn*s*0.85,s*0.35,sgn*s*0.55,s*0.85);ctx.quadraticCurveTo(sgn*s*0.1,s*0.9,sgn*s*0.15,s*0.2);ctx.stroke();}break;}
    case 'blood':case 'drop':{ctx.beginPath();ctx.moveTo(0,-s*0.85);ctx.bezierCurveTo(s*0.7,-s*0.1,s*0.55,s*0.75,0,s*0.75);ctx.bezierCurveTo(-s*0.55,s*0.75,-s*0.7,-s*0.1,0,-s*0.85);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(-s*0.18,s*0.25,s*0.16,0,7);ctx.fill();break;}
    case 'brain':{ctx.lineWidth=r*0.12;ctx.beginPath();ctx.arc(-s*0.25,0,s*0.55,0.6,2*Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(s*0.25,0,s*0.55,-Math.PI-0.6,Math.PI);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-s*0.55);ctx.lineTo(0,s*0.55);ctx.stroke();break;}
    case 'leaf':{ctx.beginPath();ctx.moveTo(-s*0.6,s*0.6);ctx.quadraticCurveTo(-s*0.6,-s*0.7,s*0.6,-s*0.6);ctx.quadraticCurveTo(s*0.6,s*0.6,-s*0.6,s*0.6);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=r*0.1;ctx.beginPath();ctx.moveTo(-s*0.45,s*0.45);ctx.lineTo(s*0.4,-s*0.4);ctx.stroke();break;}
    case 'yoga':{ctx.beginPath();ctx.arc(0,-s*0.55,s*0.22,0,7);ctx.fill();ctx.lineWidth=r*0.13;ctx.beginPath();ctx.moveTo(0,-s*0.3);ctx.lineTo(0,s*0.15);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*0.7,0);ctx.lineTo(s*0.7,0);ctx.stroke();ctx.beginPath();ctx.moveTo(0,s*0.15);ctx.lineTo(-s*0.55,s*0.7);ctx.moveTo(0,s*0.15);ctx.lineTo(s*0.55,s*0.7);ctx.stroke();break;}
    case 'venus':{ctx.lineWidth=r*0.13;ctx.beginPath();ctx.arc(0,-s*0.25,s*0.45,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(0,s*0.2);ctx.lineTo(0,s*0.85);ctx.moveTo(-s*0.3,s*0.5);ctx.lineTo(s*0.3,s*0.5);ctx.stroke();break;}
    case 'baby':{ctx.beginPath();ctx.arc(0,-s*0.25,s*0.5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*0.18,-s*0.3,s*0.07,0,7);ctx.arc(s*0.18,-s*0.3,s*0.07,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=r*0.08;ctx.beginPath();ctx.arc(0,-s*0.12,s*0.18,0.2,Math.PI-0.2);ctx.stroke();break;}
    case 'elder':{ctx.beginPath();ctx.arc(0,-s*0.5,s*0.28,0,7);ctx.fill();ctx.lineWidth=r*0.13;ctx.beginPath();ctx.moveTo(-s*0.1,-s*0.2);ctx.lineTo(-s*0.1,s*0.6);ctx.stroke();ctx.beginPath();ctx.moveTo(s*0.35,-s*0.3);ctx.lineTo(s*0.35,s*0.7);ctx.stroke();break;}
    case 'hands':{ctx.lineWidth=r*0.12;for(const sgn of[-1,1]){ctx.beginPath();ctx.moveTo(sgn*s*0.5,s*0.7);ctx.lineTo(sgn*s*0.15,0);ctx.stroke();}ctx.beginPath();ctx.arc(0,-s*0.1,s*0.32,0,7);ctx.stroke();break;}
    case 'nosmoke':{ctx.lineWidth=r*0.1;ctx.strokeStyle=color;ctx.strokeRect(-s*0.6,s*0.1,s*1.2,s*0.35);ctx.beginPath();ctx.arc(0,0,s*0.85,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*0.6,-s*0.6);ctx.lineTo(s*0.6,s*0.6);ctx.stroke();break;}
    case 'mosquito':{ctx.beginPath();ctx.arc(0,0,s*0.22,0,7);ctx.fill();ctx.lineWidth=r*0.08;for(const sgn of[-1,1]){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(sgn*s*0.6,-s*0.5,sgn*s*0.9,-s*0.1);ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(sgn*s*0.6,s*0.5,sgn*s*0.9,s*0.2);ctx.stroke();}break;}
    case 'flask':{ctx.lineWidth=r*0.12;ctx.beginPath();ctx.moveTo(-s*0.2,-s*0.7);ctx.lineTo(-s*0.2,-s*0.1);ctx.lineTo(-s*0.55,s*0.6);ctx.lineTo(s*0.55,s*0.6);ctx.lineTo(s*0.2,-s*0.1);ctx.lineTo(s*0.2,-s*0.7);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*0.35,-s*0.7);ctx.lineTo(s*0.35,-s*0.7);ctx.stroke();break;}
    default:{ // medical cross
      ctx.fillRect(-s*0.22,-s*0.7,s*0.44,s*1.4);ctx.fillRect(-s*0.7,-s*0.22,s*1.4,s*0.44);}

}
function wrapLines(ctx,text,maxW){
  const words=String(text).split(/\s+/);const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function renderPoster(topic,dateObj,lang,size,settings){
  const cv=document.createElement('canvas');cv.width=size.w;cv.height=size.h;
  const ctx=cv.getContext('2d');
  const en=lang.code==='en';
  const green=settings.brandGreen||'#1a9f6e', blue=settings.brandBlue||'#1668c1';
  const S=size.w/1080; // scale factor relative to base width
  const title=en?topic.title_en:topic.title_gu;
  const imp=en?topic.importance_en:topic.importance_gu;
  const points=en?topic.keyPoints_en:topic.keyPoints_gu;
  const cta=en?topic.cta_en:topic.cta_gu;

  // Background
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
  // subtle top band gradient (green health theme)
  const headH=size.h*0.20;
  const g=ctx.createLinearGradient(0,0,cv.width,headH);
  g.addColorStop(0,green);g.addColorStop(1,shade(green,-25));
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,headH);
  // decorative circle
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(cv.width*0.9,headH*0.3,headH*0.7,0,7);ctx.fill();

  // Header: date + category chip
  ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.font=`600 ${28*S}px ${'Segoe UI,Noto Sans Gujarati,sans-serif'}`;
  const dateStr=en?fmtLongDate(dateObj):dateObj.toLocaleDateString('gu-IN',{day:'numeric',month:'long',year:'numeric'});
  ctx.fillText(dateStr,60*S,48*S);
  // category chip
  ctx.font=`700 ${24*S}px Segoe UI,sans-serif`;
  const chip=(en?topic.category:topic.category).toUpperCase();
  const cw=ctx.measureText(chip).width+40*S;
  ctx.fillStyle='rgba(255,255,255,.22)';roundRect(ctx,60*S,90*S,cw,44*S,22*S);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText(chip,80*S,100*S);

  // Awareness title (large)
  ctx.fillStyle='#ffffff';
  let ty=150*S;
  ctx.font=`800 ${58*S}px Segoe UI,Noto Sans Gujarati,sans-serif`;
  const tLines=wrapLines(ctx,title,cv.width-120*S);
  for(const ln of tLines.slice(0,2)){ctx.fillText(ln,60*S,ty);ty+=66*S;}

  // Illustration area
  const illoY=headH+ (size.h*0.02);
  const illoH=size.h*0.24;
  const cx=cv.width/2, cy=illoY+illoH/2;
  // soft circle backing
  ctx.fillStyle=shade(green,120);ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(cx,cy,illoH*0.46,0,7);ctx.fill();ctx.globalAlpha=1;
  drawIcon(ctx,topic.icon,cx,cy,illoH*0.30,green);

  // Importance line
  let y=illoY+illoH+ size.h*0.015;
  ctx.fillStyle=blue;
  ctx.font=`700 ${34*S}px Segoe UI,Noto Sans Gujarati,sans-serif`;
  const impLines=wrapLines(ctx,imp,cv.width-120*S);
  for(const ln of impLines.slice(0,3)){ctx.fillText(ln,60*S,y);y+=44*S;}
  y+=14*S;

  // Four key points
  ctx.font=`600 ${30*S}px Segoe UI,Noto Sans Gujarati,sans-serif`;
  const bulletR=11*S;
  for(let i=0;i<Math.min(4,points.length);i++){
    ctx.fillStyle=green;ctx.beginPath();ctx.arc(74*S,y+18*S,bulletR,0,7);ctx.fill();
    ctx.fillStyle='#243039';
    const pl=wrapLines(ctx,points[i],cv.width-150*S);
    for(let j=0;j<pl.length;j++){ctx.fillText(pl[j],104*S,y+ (j*38*S));}
    y+=Math.max(52*S, pl.length*38*S+14*S);
  }

  // Call to action band
  y+=6*S;
  const ctaH=size.h*0.09;
  const cg=ctx.createLinearGradient(0,y,cv.width,y+ctaH);cg.addColorStop(0,blue);cg.addColorStop(1,shade(blue,-30));
  ctx.fillStyle=cg;roundRect(ctx,40*S,y,cv.width-80*S,ctaH,20*S);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`800 ${34*S}px Segoe UI,Noto Sans Gujarati,sans-serif`;
  const ctaLines=wrapLines(ctx,cta,cv.width-160*S);
  const ctaStartY=y+ (ctaH-ctaLines.length*42*S)/2;
  for(let i=0;i<ctaLines.length;i++){const t=ctaLines[i];const w=ctx.measureText(t).width;ctx.fillText(t,(cv.width-w)/2,ctaStartY+i*42*S);}

  // Footer
  const footY=cv.height-size.h*0.11;
  ctx.fillStyle='#f2f6f8';ctx.fillRect(0,footY,cv.width,cv.height-footY);
  ctx.fillStyle=green;ctx.fillRect(0,footY,cv.width,4*S);
  // hashtags
  ctx.fillStyle=green;ctx.font=`700 ${24*S}px Segoe UI,sans-serif`;
  const tags=(topic.hashtags||[]).map(h=>'#'+h).join('  ');
  ctx.fillText(tags,60*S,footY+22*S);
  // org + footer note
  ctx.fillStyle='#4a5761';ctx.font=`600 ${22*S}px Segoe UI,Noto Sans Gujarati,sans-serif`;
  ctx.fillText((settings.org||'')+ (settings.footer?('  •  '+settings.footer):''),60*S,footY+56*S);
  // logo placeholder / logo
  const lpx=cv.width-150*S, lpy=footY+18*S, lps=size.h*0.055;
  if(settings.logoData){
    const im=logoImageCache; if(im&&im.complete&&im.naturalWidth){try{ctx.drawImage(im,lpx,lpy,lps,lps);}catch(e){}}
  } else {
    ctx.strokeStyle='#c3ced5';ctx.lineWidth=2*S;ctx.setLineDash([6*S,5*S]);ctx.strokeRect(lpx,lpy,lps,lps);ctx.setLineDash([]);
    ctx.fillStyle='#9aa7b0';ctx.font=`600 ${16*S}px Segoe UI`;ctx.fillText('LOGO',lpx+lps*0.22,lpy+lps*0.4);
  }
  // QR placeholder
  const qx=cv.width-lps-190*S, qy=footY+18*S;
  ctx.strokeStyle='#c3ced5';ctx.lineWidth=2*S;ctx.setLineDash([6*S,5*S]);ctx.strokeRect(qx,qy,lps,lps);ctx.setLineDash([]);
  ctx.fillStyle='#9aa7b0';ctx.font=`600 ${15*S}px Segoe UI`;ctx.fillText('QR',qx+lps*0.34,qy+lps*0.4);

  // Watermark
  if(settings.watermark){
    ctx.save();ctx.globalAlpha=0.10;ctx.translate(cv.width/2,cv.height/2);ctx.rotate(-0.5);
    ctx.fillStyle='#0f7a52';ctx.font=`800 ${70*S}px Segoe UI`;ctx.textAlign='center';
    ctx.fillText(settings.watermark,0,0);ctx.restore();ctx.textAlign='left';
  }
  return cv;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
let logoImageCache=null;

/* Generate + store a set of posters for a date/lang(s)/size(s) */
async function generateSet(dateObj,langs,sizes){
  const settings=getSettings();refreshLogoCache();
  if(settings.logoData){await new Promise(r=>{if(logoImageCache.complete)r();else{logoImageCache.onload=r;logoImageCache.onerror=r;}});}
  const topic=topicForDate(dateObj);const dateStr=ymd(dateObj);
  const made=[];
  for(const lang of langs){
    for(const size of sizes){
      const cv=renderPoster(topic,dateObj,lang,size,settings);

      const rec={id:posterId(dateStr,lang.key,size.key),date:dateStr,category:topic.category,
        topic:lang.code==='en'?topic.title_en:topic.title_gu,topicEn:topic.title_en,

function buildCaptions(topic,dateObj,langCode){
  const en=langCode==='en';
  const title=en?topic.title_en:topic.title_gu;
  const imp=en?topic.importance_en:topic.importance_gu;
  const pts=(en?topic.keyPoints_en:topic.keyPoints_gu);
  const cta=en?topic.cta_en:topic.cta_gu;
  const tags=(topic.hashtags||[]).map(h=>'#'+h).join(' ');
  const extra=(getSettings().defaultHashtags||'').split(/\s+/).filter(Boolean).map(h=>'#'+h.replace(/^#/,'')).join(' ');
  const allTags=(tags+' '+extra).trim();
  const bullets=pts.map(p=>'• '+p).join('\n');
  const emojiTitle=(en?'📢 ':'📢 ')+title;
  const short=`${emojiTitle}\n${cta}\n${allTags}`;
  const medium=`${emojiTitle}\n\n${imp}\n\n${bullets}\n\n👉 ${cta}\n\n${allTags}`;
  const long=`${emojiTitle}\n\n${imp}\n\n${en?'Key things to remember:':'યાદ રાખવા જેવી બાબતો:'}\n${bullets}\n\n${en?'What you can do today:':'આજે તમે શું કરી શકો:'}\n👉 ${cta}\n\n${en?'Share this message to spread awareness in your community.':'આ સંદેશ શેર કરી તમારા સમાજમાં જાગૃતિ ફેલાવો.'}\n\n${allTags}`;
  return {
    WhatsApp:medium, Telegram:medium, Instagram:medium, Facebook:long, LinkedIn:long,
    'Twitter/X':short, Short:short, Medium:medium, Long:long
  };
}

/* =====================================================================
   6. MINIMAL STORE-ONLY ZIP WRITER (pure JS, no deps)
   ===================================================================== */
const CRC_TABLE=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strBytes(s){const out=[];for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c<128)out.push(c);else out.push(...new TextEncoder().encode(s[i]));}return out;}
function u16(n){return [n&255,(n>>8)&255];}
function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function makeZip(files){ // files: [{name, bytes:Uint8Array}]
  const chunks=[];const central=[];let offset=0;
  for(const f of files){
    const nameB=strBytes(f.name);const data=f.bytes;const crc=crc32(data);const sz=data.length;
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nameB.length),...u16(0),...nameB];
    const lb=new Uint8Array(local.length+sz);lb.set(local,0);lb.set(data,local.length);chunks.push(lb);
    const cen=[...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nameB.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nameB];
    central.push(new Uint8Array(cen));offset+=lb.length;
  }
  let cenSize=0;central.forEach(c=>cenSize+=c.length);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenSize),...u32(offset),...u16(0)]);
  const total=offset+cenSize+end.length;const out=new Uint8Array(total);let p=0;
  chunks.forEach(c=>{out.set(c,p);p+=c.length;});central.forEach(c=>{out.set(c,p);p+=c.length;});out.set(end,p);
  return new Blob([out],{type:'application/zip'});
}
function dataURLtoBytes(durl){const b64=durl.split(',')[1];const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function downloadDataURL(durl,name){const a=document.createElement('a');a.href=durl;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);}

async function downloadDay(dateStr){
  const all=(await dbAll()).filter(p=>p.date===dateStr);
  if(!all.length)return toast('Nothing generated for '+dateStr);
  const [Y,M,D]=dateStr.split('-').map(Number);const dObj=new Date(Y,M-1,D);const topic=topicForDate(dObj);

  files.push({name:'captions.json',bytes:new Uint8Array(strBytes(JSON.stringify({en:buildCaptions(topic,dObj,'en'),gu:buildCaptions(topic,dObj,'gu')},null,2)))});
  files.push({name:'metadata.json',bytes:new Uint8Array(strBytes(JSON.stringify({date:dateStr,topic:topic.title_en,topic_gu:topic.title_gu,category:topic.category,hashtags:topic.hashtags,images:all.map(({dataURL,...m})=>m)},null,2)))});
  downloadBlob(makeZip(files),`${dateStr}_${slug(topic.category)}_HealthAwareness.zip`);
  for(const p of all)await dbPut(Object.assign(p,{downloaded:true}));
  addLog({date:dateStr,topic:topic.title_en,category:topic.category,event:'Downloaded',count:all.length});
  toast('ZIP downloaded');
}
async function downloadFiltered(pred,name){
  const all=(await dbAll()).filter(pred);
  if(!all.length)return toast('Nothing to download');
  const files=all.map(p=>({name:p.date.slice(0,7)+'/'+p.fileName,bytes:dataURLtoBytes(p.dataURL)}));
  files.push({name:'metadata.json',bytes:new Uint8Array(strBytes(JSON.stringify(all.map(({dataURL,...m})=>m),null,2)))});
  downloadBlob(makeZip(files),name+'.zip');
  for(const p of all)await dbPut(Object.assign(p,{downloaded:true}));
  toast('ZIP downloaded ('+all.length+' images)');
}

function progress(l,v,total){const pct=total?Math.round(v/total*100):0;return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${l}</span><b>${v}/${total} (${pct}%)</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;}
function chartCard(title,node){const c=el(`<div class="col card"><h3 class="sec">${esc(title)}</h3></div>`);c.appendChild(node);return c;}
function cvBar(data){
  const keys=Object.keys(data).sort();const vals=keys.map(k=>data[k]);const max=Math.max(...vals,1);
  const w=Math.max(320,keys.length*70),h=200;const cv=document.createElement('canvas');cv.width=w*2;cv.height=h*2;cv.style.width='100%';cv.style.maxWidth=w+'px';cv.style.height=h+'px';
  const ctx=cv.getContext('2d');ctx.scale(2,2);ctx.font='11px Segoe UI';
  const bw=w/keys.length*0.55;
  keys.forEach((k,i)=>{const x=i*(w/keys.length)+(w/keys.length-bw)/2;const bh=(vals[i]/max)*(h-46);
    ctx.fillStyle='#1a9f6e';roundRect(ctx,x,h-30-bh,bw,bh,5);ctx.fill();
    ctx.fillStyle='#65727d';ctx.textAlign='center';ctx.fillText(k.slice(2),x+bw/2,h-14);
    ctx.fillStyle='#243039';ctx.fillText(vals[i],x+bw/2,h-34-bh);});
  return cv;
}
function cvDonut(data,palette){
  const keys=Object.keys(data).filter(k=>data[k]>0);const total=keys.reduce((a,k)=>a+data[k],0)||1;
  const cols=palette||keys.map(k=>CATEGORIES[k]?.color||'#'+((Math.abs(hash(k))&0xffffff).toString(16).padStart(6,'0')));
  const size=180;const cv=document.createElement('canvas');cv.width=size*2;cv.height=size*2;cv.style.width=size+'px';cv.style.height=size+'px';
  const ctx=cv.getContext('2d');ctx.scale(2,2);let a=-Math.PI/2;const cx=size/2,cy=size/2,r=size/2-6;
  keys.forEach((k,i)=>{const ang=data[k]/total*2*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+ang);ctx.closePath();ctx.fillStyle=cols[i];ctx.fill();a+=ang;});
  ctx.beginPath();ctx.arc(cx,cy,r*0.58,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#243039';ctx.textAlign='center';ctx.font='700 20px Segoe UI';ctx.fillText(total,cx,cy-4);ctx.font='11px Segoe UI';ctx.fillStyle='#65727d';ctx.fillText('total',cx,cy+12);
  const wrap=document.createElement('div');wrap.appendChild(cv);
  wrap.appendChild(el(`<div class="chart-legend">${keys.map((k,i)=>`<span><i style="background:${cols[i]}"></i>${esc(k)} (${data[k]})</span>`).join('')}</div>`));
  return wrap;
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h<<5)-h+s.charCodeAt(i)|0;return h;}

async function dailyAutoRun(){
  const dateStr=ymd(new Date());
  const lastRun=LS.get('lastAutoRun','');
  if(lastRun===dateStr)return;
  // Only auto-generate if nothing exists for today yet
  const all=await dbAll();
  if(!all.some(p=>p.date===dateStr)){
    await generateSet(new Date(),LANGS,SIZES);
    LS.set('lastAutoRun',dateStr);
    toast('✓ Today’s posters auto-generated');
  } else {LS.set('lastAutoRun',dateStr);}
}

/* =====================================================================
   9. BOOT
   ===================================================================== */
(async function boot(){
  refreshLogoCache();
  await dailyAutoRun().catch(()=>{});
  go('home');
})();
</script>
