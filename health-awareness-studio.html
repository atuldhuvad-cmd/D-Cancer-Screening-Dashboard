<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Health Awareness Studio</title>
<meta name="description" content="Automated daily health-awareness poster generation for hospitals, NGOs, public-health departments and government campaigns." />
<style>
/* ============================================================
   Health Awareness Studio — self-contained, offline-capable.
   No external frameworks. Vanilla HTML/CSS/JS + IndexedDB.
   Theme: White / Green / Medical Blue.
   ============================================================ */
:root{
  --green:#1a9f6e; --green-dark:#0f7a52; --green-soft:#e7f6ef;
  --blue:#1668c1; --blue-soft:#e8f1fb;
  --ink:#1f2a33; --muted:#65727d; --line:#e6ebef; --bg:#f4f7f9;
  --card:#ffffff; --warn:#d98a1a; --danger:#d9482b; --ok:#1a9f6e;
  --radius:16px; --shadow:0 1px 2px rgba(16,40,60,.05),0 6px 18px rgba(16,40,60,.06);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,'Noto Sans',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.5}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* Sidebar */
.side{background:linear-gradient(180deg,#0f7a52,#0c6647);color:#eafaf3;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--green-dark);font-weight:800;font-size:20px}
.brand h1{font-size:15px;margin:0;line-height:1.15;font-weight:700}
.brand small{color:#bfe6d6;font-size:11px;font-weight:500}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#dff5ea;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
.nav button .ic{width:20px;text-align:center}
.nav button:hover{background:rgba(255,255,255,.09)}
.nav button.active{background:#fff;color:var(--green-dark);font-weight:700}
.side .foot{margin-top:18px;font-size:11px;color:#bfe6d6;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
/* Main */
.main{padding:22px 26px 60px;overflow:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:20px}
.topbar .sub{color:var(--muted);font-size:13px}
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:240px}
.searchbox input{border:0;outline:0;flex:1;font-size:14px;background:transparent}
/* cards */
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .val{font-size:26px;font-weight:800;line-height:1}
.stat .hint{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green-dark)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.warn{background:#fdf1e0;color:var(--warn)}
.pill.gray{background:#eef2f5;color:var(--muted)}
.pill.danger{background:#fbe9e5;color:var(--danger)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
h3.sec{font-size:15px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.12s}
.btn:hover{border-color:#cdd6dd;background:#fbfdfe}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.blue:hover{background:#12569f}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px}
input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:0;background:#fff}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--green)}
.field{margin-bottom:14px}
.muted{color:var(--muted)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.posterwrap{background:#f0f4f6;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.posterwrap canvas,.posterwrap img{max-width:100%;height:auto;border-radius:8px;box-shadow:var(--shadow);background:#fff}
.thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.thumb{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.thumb .imgbox{background:#eef3f5;display:grid;place-items:center;aspect-ratio:1/1;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .meta{padding:9px 10px;font-size:11.5px}
.thumb .meta b{display:block;font-size:12px;margin-bottom:3px}
.thumb .actions{display:flex;gap:6px;padding:0 10px 10px}
.thumb .actions .btn{padding:5px 8px;font-size:11px;flex:1;justify-content:center}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.tbl th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calcell{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:78px;padding:7px;font-size:11.5px;cursor:pointer;position:relative}
.calcell:hover{border-color:var(--green)}
.calcell.empty{background:transparent;border:0;cursor:default}
.calcell .d{font-weight:700;color:var(--muted)}
.calcell.today{outline:2px solid var(--green)}
.calcell .ev{margin-top:4px;font-weight:600;line-height:1.25;color:var(--ink);font-size:10.5px}
.calcell .cat{position:absolute;bottom:6px;left:7px;width:8px;height:8px;border-radius:50%}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow div{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.captionbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin-bottom:12px}
.captionbox .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.captionbox pre{white-space:pre-wrap;font-family:inherit;font-size:13px;margin:0;color:#2b3843}
.bar{height:8px;background:#eef2f5;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:999px}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:12px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:10px;height:10px;border-radius:3px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state .big{font-size:40px;margin-bottom:8px}
.hide{display:none!important}
.countdown{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;color:var(--blue)}
.badge-lang{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px}
.badge-lang.en{background:var(--blue-soft);color:var(--blue)}
.badge-lang.gu{background:var(--green-soft);color:var(--green-dark)}
@media (max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>

  <!-- ===================== MAIN ===================== -->
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

function nthWeekday(y,m,wd,nth){let c=0;for(let d=1;d<=31;d++){const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1)break;if(dt.getDay()===wd){c++;if(c===nth)return d;}}return null;}
function movableForDate(d){const y=d.getFullYear();for(const mv of MOVABLE){if((mv.month-1)===d.getMonth()){const day=nthWeekday(y,mv.month,mv.weekday,mv.nth);if(day===d.getDate())return mv;}}return null;}
function normT(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
const MOVABLE_NAMES=new Set(MOVABLE.flatMap(m=>m.names.map(normT)));

/* Build calendar index from CAL2, stripping movable observances (added back year-aware) */
const CALENDAR={};
CAL2.forEach(r=>{
  const [m,d,en,gu,status,bucket,subj]=r;
  const ep=en.split('/').map(s=>s.trim()), gp=gu.split('/').map(s=>s.trim());
  const keepE=[],keepG=[];
  ep.forEach((p,i)=>{ if(!MOVABLE_NAMES.has(normT(p))){keepE.push(p); keepG.push(gp[i]!==undefined?gp[i]:p);} });
  if(!keepE.length) return; // movable-only slot: skip (resolver supplies it)
  CALENDAR[m+'-'+d]={month:m,day:d,title:keepE.join(' / '),title_gu:keepG.join(' / '),status,bucket,subj};
});

function deriveTags(title,seed){
  const words=String(title).replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,4);
  const first=words.map(w=>w[0].toUpperCase()+w.slice(1)).join('');
  const t=[first];(seed||[]).forEach(s=>{if(!t.includes(s))t.push(s);});
  return t.slice(0,3);
}

/* Resolve full topic for any date — 365-day, subject-specific + movable + status */
function topicForDate(d){
  const key=(d.getMonth()+1)+'-'+d.getDate();
  let row=CALENDAR[key], mv=movableForDate(d), movable=false;
  // movable observances override arbitrary studio rotations, but yield to official/recognised fixed days
  if(mv && (!row || row.status==='studio')) row=null;
  let title_en,title_gu,status,bucket,subj;
  if(row){ title_en=row.title; title_gu=row.title_gu; status=row.status; bucket=row.bucket; subj=row.subj; mv=null; }
  else if(mv){ title_en=mv.title_en; title_gu=mv.title_gu; status='recognized'; bucket=mv.bucket; subj=mv.subject; movable=true; }
  else { title_en='Daily Health Awareness'; title_gu='દૈનિક આરોગ્ય જાગૃતિ'; status='studio'; bucket='Health'; subj=''; }
  // content source: health subject > movable's own content > civic template
  let c;
  if(subj && SUBJECTS[subj]) c=SUBJECTS[subj];
  else if(mv) c={ie:mv.ie,ig:mv.ig,ke:mv.ke,kg:mv.kg,ce:mv.ce,cg:mv.cg,icon:mv.icon,tags:mv.tg};
  else c=TEMPLATES[bucket]||TEMPLATES.Health;
  const seed=c.tags||c.tg||[];
  return {
    month:d.getMonth()+1, day:d.getDate(),
    title_en, title_gu, category:bucket, status, movable,
    importance_en:c.ie, importance_gu:c.ig,
    keyPoints_en:c.ke, keyPoints_gu:c.kg,
    cta_en:c.ce, cta_gu:c.cg,
    hashtags:deriveTags(title_en,seed),
    icon:c.icon||(CATEGORIES[bucket]?CATEGORIES[bucket].icon:'cross'),
    specific: !!(subj && SUBJECTS[subj]) || movable
  };
}

   ===================================================================== */
const DB_NAME='has_db', STORE='posters', ASSETS='assets';
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const rq=indexedDB.open(DB_NAME,2);
    rq.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        const os=db.createObjectStore(STORE,{keyPath:'id'});
        os.createIndex('date','date'); os.createIndex('language','language');
        os.createIndex('category','category');
      }
      if(!db.objectStoreNames.contains(ASSETS)){
        db.createObjectStore(ASSETS,{keyPath:'key'}); // theme hero images: {key, dataURL, title, ts}
      }

      const slot=posterSlot(dateStr,lang.key,size.key);
      const slotRecs=existing.filter(p=>p.slot===slot);
      const nextV=slotRecs.reduce((m,p)=>Math.max(m,p.version||1),0)+1;
      // deactivate previous active version of this slot (in the same tx)
      slotRecs.filter(p=>p.active).forEach(p=>updates.push(Object.assign({},p,{active:false})));
      const cv=renderPoster(topic,dateObj,lang,size,settings,heroImg); // may throw -> abort, nothing stored
      const url=canvasToDataURL(cv,settings.quality);
      puts.push({id:posterId(dateStr,lang.key,size.key,nextV),slot,version:nextV,active:true,hasImage:!!heroImg,
        date:dateStr,category:topic.category,status:topic.status,
        topic:lang.code==='en'?topic.title_en:topic.title_gu,topicEn:topic.title_en,
        language:lang.key,size:size.key,w:size.w,h:size.h,dataURL:url,
        published:false,downloaded:false,createdAt:Date.now(),
        fileName:fileName(dateStr,topic.category,lang.key,size.key,settings.quality,nextV)});
    }
  }
  await dbBatch(puts,updates); // atomic commit of the whole set
  addLog({date:dateStr,topic:topic.title_en,category:topic.category,event:'Generated',count:puts.length});
  return puts;
}
/* Mark all of a day's active posters published in ONE transaction (atomic). */
async function markPublishedForDate(dateStr){
  const active=(await dbAll()).filter(p=>p.date===dateStr && p.active!==false);
  if(!active.length) return 0;
  await dbBatch([], active.map(p=>Object.assign({},p,{published:true})));
  const t=topicForDate(new Date(dateStr.split('-')[0],dateStr.split('-')[1]-1,dateStr.split('-')[2]));
  addLog({date:dateStr,topic:t.title_en,category:t.category,event:'Published',count:active.length});
  return active.length;
}

/* =====================================================================
   6. MINIMAL STORE-ONLY ZIP WRITER (pure JS, no deps)
   ===================================================================== */
const CRC_TABLE=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strBytes(s){const out=[];for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c<128)out.push(c);else out.push(...new TextEncoder().encode(s[i]));}return out;}
function u16(n){return [n&255,(n>>8)&255];}
function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function makeZip(files){ // files: [{name, bytes:Uint8Array}]
  const chunks=[];const central=[];let offset=0;
  for(const f of files){
    const nameB=strBytes(f.name);const data=f.bytes;const crc=crc32(data);const sz=data.length;
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nameB.length),...u16(0),...nameB];
    const lb=new Uint8Array(local.length+sz);lb.set(local,0);lb.set(data,local.length);chunks.push(lb);
    const cen=[...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nameB.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nameB];
    central.push(new Uint8Array(cen));offset+=lb.length;
  }
  let cenSize=0;central.forEach(c=>cenSize+=c.length);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenSize),...u32(offset),...u16(0)]);
  const total=offset+cenSize+end.length;const out=new Uint8Array(total);let p=0;
  chunks.forEach(c=>{out.set(c,p);p+=c.length;});central.forEach(c=>{out.set(c,p);p+=c.length;});out.set(end,p);
  return new Blob([out],{type:'application/zip'});
}
function dataURLtoBytes(durl){const b64=durl.split(',')[1];const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function downloadDataURL(durl,name){const a=document.createElement('a');a.href=durl;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);}

let libState={group:'Month',search:'',fCat:'',fLang:'',fStatus:''};
async function pageLibrary(){
  const raw=await dbAll();
  const versionsBySlot={};raw.forEach(p=>{(versionsBySlot[p.slot]=versionsBySlot[p.slot]||[]).push(p);});
  const all=activeOnly(raw).sort((a,b)=>b.date.localeCompare(a.date)||a.language.localeCompare(b.language));
  main.innerHTML=topbar('Poster Library',all.length+' active • '+raw.length+' incl. versions',
    `<div class="searchbox"><span>🔍</span><input id="libSearch" placeholder="Search…" value="${esc(libState.search)}"></div>`);
  const bar=el(`<div class="card" style="margin-bottom:16px"><div class="btnrow">
    <select class="inp" id="libGroup" style="width:auto"><option>Month</option><option>Category</option><option>Language</option><option>Status</option><option>Year</option></select>
    <select class="inp" id="libCat" style="width:auto"><option value="">All categories</option>${Object.keys(CATEGORIES).map(c=>`<option ${c===libState.fCat?'selected':''}>${c}</option>`).join('')}</select>
    <select class="inp" id="libLang" style="width:auto"><option value="">All languages</option><option>English</option><option>Gujarati</option></select>
    <select class="inp" id="libStatus" style="width:auto"><option value="">All status</option><option value="published">Published</option><option value="pending">Pending</option><option value="downloaded">Downloaded</option></select>
  </div></div>`);
  main.appendChild(bar);
  const wrap=el('<div id="libWrap"></div>');main.appendChild(wrap);
  document.getElementById('libGroup').value=libState.group;
  document.getElementById('libLang').value=libState.fLang;
  document.getElementById('libStatus').value=libState.fStatus;
  ['libSearch','libGroup','libCat','libLang','libStatus'].forEach(id=>{const e=document.getElementById(id);e.oninput=e.onchange=()=>{libState.search=document.getElementById('libSearch').value;libState.group=document.getElementById('libGroup').value;libState.fCat=document.getElementById('libCat').value;libState.fLang=document.getElementById('libLang').value;libState.fStatus=document.getElementById('libStatus').value;render();};});

  function render(){
    let list=all.filter(p=>{
      if(libState.search&&!(p.topic+p.topicEn+p.date).toLowerCase().includes(libState.search.toLowerCase()))return false;
      if(libState.fCat&&p.category!==libState.fCat)return false;
      if(libState.fLang&&p.language!==libState.fLang)return false;
      if(libState.fStatus==='published'&&!p.published)return false;
      if(libState.fStatus==='pending'&&p.published)return false;
      if(libState.fStatus==='downloaded'&&!p.downloaded)return false;
      return true;
    });
    if(!list.length){wrap.innerHTML=`<div class="card"><div class="empty-state"><div class="big">🗂️</div>No posters match. Generate some from the Poster Generator.</div></div>`;return;}
    const keyer={Month:p=>p.date.slice(0,7),Category:p=>p.category,Language:p=>p.language,Status:p=>p.published?'Published':'Pending',Year:p=>p.date.slice(0,4)}[libState.group];
    const groups={};list.forEach(p=>{const k=keyer(p);(groups[k]=groups[k]||[]).push(p);});
    wrap.innerHTML=Object.keys(groups).sort().reverse().map(k=>`
      <div class="card" style="margin-bottom:16px"><h3 class="sec">${esc(k)} <span class="muted">(${groups[k].length})</span></h3>
      <div class="thumbgrid">${groups[k].map(p=>thumb(p)).join('')}</div></div>`).join('');
    wrap.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const p=await dbGet(b.dataset.dl);downloadDataURL(p.dataURL,p.fileName);await dbPut(Object.assign(p,{downloaded:true}));toast('Downloaded');});
    wrap.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await dbDelete(b.dataset.del);toast('Deleted');pageLibrary();});
    wrap.querySelectorAll('[data-pub]').forEach(b=>b.onclick=async()=>{const p=await dbGet(b.dataset.pub);await dbPut(Object.assign(p,{published:!p.published}));toast(p.published?'Marked pending':'Marked published');pageLibrary();});
    wrap.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>showHistory(b.dataset.hist));
  }
  function thumb(p){
    const vers=(versionsBySlot[p.slot]||[]).length;
    const hist=vers>1?`<button class="btn" data-hist="${p.slot}" title="${vers} versions">🕘${vers}</button>`:'';
    return `<div class="thumb"><div class="imgbox"><img src="${p.dataURL}" loading="lazy"></div>
      <div class="meta"><b>${esc(p.topicEn)}</b>
      <span class="badge-lang ${p.language[0]==='E'?'en':'gu'}">${p.language[0]==='E'?'EN':'GU'}</span> ${p.size} • ${p.date} <span class="pill gray">v${p.version||1}</span>
      <div style="margin-top:4px">${(STATUS_LABEL[p.status]?('<span class="pill '+STATUS_LABEL[p.status].cls+'">'+(p.status==='official'?'Official':p.status==='recognized'?'Recognised':'Studio')+'</span>'):'')} ${p.published?'<span class="pill">Published</span>':'<span class="pill warn">Pending</span>'} ${p.downloaded?'<span class="pill gray">DL</span>':''}</div></div>
      <div class="actions"><button class="btn" data-dl="${p.id}">⬇️</button><button class="btn" data-pub="${p.id}">✓</button>${hist}<button class="btn" data-del="${p.id}">🗑️</button></div></div>`;
  }
  function showHistory(slot){
    const vs=(versionsBySlot[slot]||[]).slice().sort((a,b)=>(b.version||1)-(a.version||1));
    const card=el(`<div class="card" style="margin-top:16px" id="histCard"><div class="topbar" style="margin-bottom:8px"><h3 class="sec" style="margin:0">Version history — ${esc(vs[0].topicEn)} • ${vs[0].language} ${vs[0].size}</h3><button class="btn sm" id="histClose">Close</button></div>
      <div class="thumbgrid">${vs.map(p=>`<div class="thumb"><div class="imgbox"><img src="${p.dataURL}"></div><div class="meta"><b>v${p.version||1}</b> ${p.active!==false?'<span class="pill">Active</span>':''}<div class="muted" style="margin-top:3px">${new Date(p.createdAt).toLocaleString('en-IN')}</div></div><div class="actions"><button class="btn" data-rdl="${p.id}">⬇️</button>${p.active!==false?'':`<button class="btn" data-restore="${p.id}">↩ Restore</button>`}<button class="btn" data-rdel="${p.id}">🗑️</button></div></div>`).join('')}</div></div>`);
    const old=document.getElementById('histCard');if(old)old.remove();
    main.appendChild(card);
    card.querySelector('#histClose').onclick=()=>card.remove();
    card.querySelectorAll('[data-rdl]').forEach(b=>b.onclick=async()=>{const p=await dbGet(b.dataset.rdl);downloadDataURL(p.dataURL,p.fileName);toast('Downloaded');});
    card.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{await dbDelete(b.dataset.rdel);toast('Version deleted');pageLibrary();});
    card.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.restore;const p=await dbGet(id);const others=(versionsBySlot[p.slot]||[]).filter(x=>x.active!==false);
      await dbBatch([Object.assign({},p,{active:true})], others.map(x=>Object.assign({},x,{active:false})));
      toast('Restored v'+(p.version||1));pageLibrary();});
    card.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  render();
}

async function downloadDay(dateStr){
  const all=activeOnly(await dbAll()).filter(p=>p.date===dateStr);
  if(!all.length)return toast('Nothing generated for '+dateStr);
  const [Y,M,D]=dateStr.split('-').map(Number);const dObj=new Date(Y,M-1,D);const topic=topicForDate(dObj);

  files.push({name:'captions.json',bytes:new Uint8Array(strBytes(JSON.stringify({en:buildCaptions(topic,dObj,'en'),gu:buildCaptions(topic,dObj,'gu')},null,2)))});
  files.push({name:'metadata.json',bytes:new Uint8Array(strBytes(JSON.stringify({date:dateStr,topic:topic.title_en,topic_gu:topic.title_gu,category:topic.category,hashtags:topic.hashtags,images:all.map(({dataURL,...m})=>m)},null,2)))});
  downloadBlob(makeZip(files),`${dateStr}_${slug(topic.category)}_HealthAwareness.zip`);
  for(const p of all)await dbPut(Object.assign(p,{downloaded:true}));
  addLog({date:dateStr,topic:topic.title_en,category:topic.category,event:'Downloaded',count:all.length});
  toast('ZIP downloaded');
}
async function downloadFiltered(pred,name){
  const all=activeOnly(await dbAll()).filter(pred);
  if(!all.length)return toast('Nothing to download');
  const files=all.map(p=>({name:p.date.slice(0,7)+'/'+p.fileName,bytes:dataURLtoBytes(p.dataURL)}));
  files.push({name:'metadata.json',bytes:new Uint8Array(strBytes(JSON.stringify(all.map(({dataURL,...m})=>m),null,2)))});
  downloadBlob(makeZip(files),name+'.zip');
  for(const p of all)await dbPut(Object.assign(p,{downloaded:true}));
  toast('ZIP downloaded ('+all.length+' images)');
}

function progress(l,v,total){const pct=total?Math.round(v/total*100):0;return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${l}</span><b>${v}/${total} (${pct}%)</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;}
function chartCard(title,node){const c=el(`<div class="col card"><h3 class="sec">${esc(title)}</h3></div>`);c.appendChild(node);return c;}
function cvBar(data){
  const keys=Object.keys(data).sort();const vals=keys.map(k=>data[k]);const max=Math.max(...vals,1);
  const w=Math.max(320,keys.length*70),h=200;const cv=document.createElement('canvas');cv.width=w*2;cv.height=h*2;cv.style.width='100%';cv.style.maxWidth=w+'px';cv.style.height=h+'px';
  const ctx=cv.getContext('2d');ctx.scale(2,2);ctx.font='11px Segoe UI';
  const bw=w/keys.length*0.55;
  keys.forEach((k,i)=>{const x=i*(w/keys.length)+(w/keys.length-bw)/2;const bh=(vals[i]/max)*(h-46);
    ctx.fillStyle='#1a9f6e';roundRect(ctx,x,h-30-bh,bw,bh,5);ctx.fill();
    ctx.fillStyle='#65727d';ctx.textAlign='center';ctx.fillText(k.slice(2),x+bw/2,h-14);
    ctx.fillStyle='#243039';ctx.fillText(vals[i],x+bw/2,h-34-bh);});
  return cv;
}
function cvDonut(data,palette){
  const keys=Object.keys(data).filter(k=>data[k]>0);const total=keys.reduce((a,k)=>a+data[k],0)||1;
  const cols=palette||keys.map(k=>CATEGORIES[k]?.color||'#'+((Math.abs(hash(k))&0xffffff).toString(16).padStart(6,'0')));
  const size=180;const cv=document.createElement('canvas');cv.width=size*2;cv.height=size*2;cv.style.width=size+'px';cv.style.height=size+'px';
  const ctx=cv.getContext('2d');ctx.scale(2,2);let a=-Math.PI/2;const cx=size/2,cy=size/2,r=size/2-6;
  keys.forEach((k,i)=>{const ang=data[k]/total*2*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+ang);ctx.closePath();ctx.fillStyle=cols[i];ctx.fill();a+=ang;});
  ctx.beginPath();ctx.arc(cx,cy,r*0.58,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#243039';ctx.textAlign='center';ctx.font='700 20px Segoe UI';ctx.fillText(total,cx,cy-4);ctx.font='11px Segoe UI';ctx.fillStyle='#65727d';ctx.fillText('total',cx,cy+12);
  const wrap=document.createElement('div');wrap.appendChild(cv);
  wrap.appendChild(el(`<div class="chart-legend">${keys.map((k,i)=>`<span><i style="background:${cols[i]}"></i>${esc(k)} (${data[k]})</span>`).join('')}</div>`));
  return wrap;
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h<<5)-h+s.charCodeAt(i)|0;return h;}

        <div class="field"><label class="fld">Brand blue</label><input class="inp" id="sBlue" type="color" value="${s.brandBlue}" style="height:42px;padding:4px"></div>
        <div class="field"><label class="fld">Image quality</label><select class="inp" id="sQual"><option value="high" ${s.quality==='high'?'selected':''}>High — PNG (lossless, larger)</option><option value="standard" ${s.quality==='standard'?'selected':''}>Standard — JPEG (smaller files)</option></select></div>
      </div>
    </div>
    <div class="field"><label class="fld">Default language</label><select class="inp" id="sLang" style="max-width:240px"><option ${s.language==='English'?'selected':''}>English</option><option ${s.language==='Gujarati'?'selected':''}>Gujarati</option></select></div>
    <div class="field"><label class="fld">Default hashtags (space separated)</label><input class="inp" id="sTags" value="${esc(s.defaultHashtags)}"></div>
    <div class="row">
      <div class="col"><div class="field"><label class="fld">Logo (appears on posters)</label><input class="inp" id="sLogo" type="file" accept="image/*"><div id="logoPrev" style="margin-top:8px">${s.logoData?`<img src="${s.logoData}" style="height:52px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff">`:'<span class="muted">No logo uploaded</span>'}</div></div></div>
      <div class="col"><div class="field"><label class="fld">QR image (generate elsewhere, upload here)</label><input class="inp" id="sQr" type="file" accept="image/*"><div id="qrPrev" style="margin-top:8px">${s.qrData?`<img src="${s.qrData}" style="height:52px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff">`:'<span class="muted">No QR uploaded — a labelled placeholder is drawn</span>'}</div></div></div>
    </div>
    <div class="field"><label class="fld">Storage location</label><input class="inp" value="Browser IndexedDB + LocalStorage (offline, on this device)" readonly></div>
    <div class="btnrow"><button class="btn primary" id="saveS">💾 Save Settings</button><button class="btn" id="clearLogo">Remove logo</button><button class="btn" id="clearQr">Remove QR</button><button class="btn ghost" id="resetS">Reset defaults</button></div>
    <h3 class="sec" style="margin-top:22px">Storage management</h3>
    <div class="btnrow"><button class="btn" id="clearPosters">🗑️ Clear all posters</button><button class="btn danger-btn" id="resetAll" style="border-color:var(--danger);color:var(--danger)">⚠ Reset everything (posters + settings + log)</button></div>
    <h3 class="sec" style="margin-top:22px">Daily scheduler</h3>
    <p class="muted" style="font-size:12.5px">This single HTML file has no background process, so it cannot generate at exactly 08:00 IST while closed. Instead it generates the day's set the <b>first time you open the app each day</b>. For a true unattended 08:00 IST run, trigger this from an external scheduler (n8n, Make, cron, or Google Apps Script) — the JSON metadata/captions exports are designed to feed those workflows.</p>
    <h3 class="sec" style="margin-top:18px">Automation-ready</h3>
    <p class="muted" style="font-size:12.5px">Structured to connect later with n8n, Make, Google Drive/Sheets, OpenAI &amp; image APIs, and WhatsApp/LinkedIn/Facebook/Instagram/Telegram.</p>`;
  main.appendChild(card);
  let logoData=s.logoData, qrData=s.qrData;
  const readImg=(input,cb)=>{const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file);};
  document.getElementById('sLogo').onchange=e=>readImg(e.target,d=>{logoData=d;document.getElementById('logoPrev').innerHTML=`<img src="${d}" style="height:52px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff">`;});
  document.getElementById('sQr').onchange=e=>readImg(e.target,d=>{qrData=d;document.getElementById('qrPrev').innerHTML=`<img src="${d}" style="height:52px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff">`;});
  document.getElementById('clearLogo').onclick=()=>{logoData='';document.getElementById('logoPrev').innerHTML='<span class="muted">No logo uploaded</span>';};
  document.getElementById('clearQr').onclick=()=>{qrData='';document.getElementById('qrPrev').innerHTML='<span class="muted">No QR uploaded</span>';};
  document.getElementById('saveS').onclick=async()=>{
    saveSettings({org:val('sOrg'),footer:val('sFooter'),watermark:val('sWm'),brandGreen:val('sGreen'),brandBlue:val('sBlue'),quality:val('sQual'),language:val('sLang'),defaultHashtags:val('sTags'),logoData,qrData});
    await refreshLogoCache();toast('✓ Settings saved');
  };
  document.getElementById('resetS').onclick=async()=>{saveSettings(DEFAULT_SETTINGS);await refreshLogoCache();toast('Reset to defaults');pageSettings();};
  document.getElementById('clearPosters').onclick=async()=>{if(!confirm('Delete ALL generated posters (all versions)? This cannot be undone.'))return;await dbClearAll();toast('All posters cleared');pageSettings();};
  document.getElementById('resetAll').onclick=async()=>{if(!confirm('Reset EVERYTHING — posters, theme images, settings and log? This cannot be undone.'))return;await dbClearAll();await assetClearAll();['settings','log','lastAutoRun'].forEach(k=>localStorage.removeItem('has_'+k));await refreshLogoCache();toast('Everything reset');go('home');};
  function val(id){return document.getElementById(id).value;}
}

/* =====================================================================
   8. ERROR REPORTING + DAILY CATCH-UP GENERATION
   ===================================================================== */
function showError(err){
  const msg=(err&&err.message)?err.message:String(err);
  let bar=document.getElementById('errbar');
  if(!bar){bar=el('<div id="errbar" style="position:fixed;top:0;left:0;right:0;z-index:10000;background:#d9482b;color:#fff;padding:10px 16px;font-size:13px;display:flex;justify-content:space-between;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)"></div>');document.body.appendChild(bar);}
  bar.innerHTML=`<span>⚠ ${esc(msg)}</span><button style="background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:6px;cursor:pointer;padding:2px 8px">Dismiss</button>`;
  bar.querySelector('button').onclick=()=>bar.remove();
  console.error(err);
}
window.addEventListener('error',e=>showError(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showError(e.reason||'Unhandled promise rejection'));

/* On-open catch-up: generate the day's set the first time the app is opened
   each day (honest substitute for a true 08:00 IST scheduler — see Settings). */
async function dailyAutoRun(){
  const dateStr=ymd(new Date());
  if(LS.get('lastAutoRun','')===dateStr)return;
  const all=await dbAll();
  if(!all.some(p=>p.date===dateStr)){
    await generateSet(new Date(),LANGS,SIZES);
    toast('✓ Today’s posters auto-generated');
  }
  LS.set('lastAutoRun',dateStr);
}

/* =====================================================================
   9. BOOT
   ===================================================================== */
(async function boot(){
  try{
    await refreshLogoCache();
    await dailyAutoRun();
  }catch(e){ showError(new Error('Startup generation failed: '+(e&&e.message||e))); }
  finally{ go('home'); }
})();
</script>
</body>
</html>
